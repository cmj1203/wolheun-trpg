    warn: 여기서 그만두면 이 데모는 끝나. 정말 끝낼 거야, 아니면 더 해 볼래?
    quit: true
  - words: [귀찌를 벗, 귀찌를 뺀, 귀찌를 빼, 귀찌를 떼, 귀찌를 풀]
    warn: 귀찌를 떼면 은발과 붉은 눈이 그대로 드러나. 그래도 할 거야?
  - words: [웰든, 공녀, 대공가, 내 정체, 제 정체]
    warn: 적국 땅에서 신분을 밝히면 되돌릴 수 없어. 그래도 말할 거야?
  - words: [공격, 덤빈, 덤벼, 달려든, 찌른, 때린, 벤다]
    warn: 칼 든 사람한테 맨손이야. 크게 다칠 수도 있어. 그래도 할 거야?
    with: 남자

