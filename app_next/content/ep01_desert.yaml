beats:
  b00_open:
    title: 여는 글
    bg: desert_wide
    lines:
      - GM: 북대륙의 크롬웰 제국과 남대륙의 사막 대국 페시안은 오랜 적이다.
      - GM: 두 대륙 사이에는 생명이 살지 않는 죽음의 사막, 지르다가 펼쳐져 있다.
      - GM: 아시나는 크롬웰 제국 웰든 대공가의 공녀다. 여행이 좋아 신분을 숨기고 대륙을 떠돌고 있다.
      - GM: 본모습은 은발에 붉은 눈. 마법 귀찌로 머리와 눈을 갈색으로 바꿨다. 남대륙은 적국 페시안의 땅이라, 크롬웰의 공녀라는 게 들키면 붙잡히거나 목숨을 잃을 수도 있다.
      - GM: 남대륙의 도시 크라차로 가려고 지르다에 들어선 지 일주일. 길을 잃었고, 물이 떨어져 간다.
      - GM: 귀찌의 힘에도 끝이 있다. 시간이 흐를수록 마음이 급해진다.
      - GM: 살아서 사막을 건널 것. 그리고 정체를 들키지 않을 것.
    next: b01_sand

  b01_sand:
    title: 길 잃은 지 일주일
    cut: PSD 001, 005
    bg: desert_wide
    cast: { center: 아시나 }
    lines:
      - 나레이션: 뜨거운 모래 냄새가 코끝을 찔렀다. 허리춤의 물통, 가방 속 낡은 지도, 귓불의 귀찌.
      - 나레이션: 꿈에도 몰랐다. 거대한 태양 아래, 고국이 아닌 낯선 땅에서 죽음을 맞이하게 될 줄은―
      - 나레이션: 북대륙을 한 바퀴 돌고 나니 남대륙이 궁금해졌다. 목적지는 크라차. 사막 하나만 건너면 되는 줄 알았다.
      - 속마음: 하아… 하아…
        sfx: 휘이이잉
      - 속마음: 길을 헤맨 지 벌써 일주일째야…
      - 속마음: 사방이 온통 모래뿐이라 길을 알 수가 없어…
