id: ep01_desert
title: 죽음의 사막 지르다
episode: 1화 · 사막 조우
source: 웹툰 「월흔」 1화 PSD 005~014 (그림 하나비 / 각색 미예 / 원작 윤슬 / 채색 및 보정 루라키 / 도움 팀 나비, 파아란)
rating: 15세 이용가
start: b00_open

sheet:
  name: 아시나
  abilities: { 재치: 1, 손재주: 1, 매력: 2, 체력: 0, 교양: 1 }
  tracks: { 의심: 0, 집착: 0, 호감: 0, 귀찌: 8, 탈주: 0, 행운: 6 }
  reveal:
    - { note: man, tracks: [의심, 집착, 호감] }
    - { note: captive, tracks: [탈주] }
  items:
    - id: magic_bag
      name: 마법 가방
      desc: 보기보다 훨씬 많이 들어가는 마법 가방. 여행 짐과 낡은 지도가 들어 있다.
    - id: earring
      name: 마법 귀찌
      desc: 머리색과 눈 색을 바꿔 주는 귀찌. 지금은 갈색 머리와 갈색 눈으로 변장 중이다.
    - id: map
      name: 낡은 지도
      desc: 사막 한가운데서는 별 도움이 되지 않는 지도.
    - id: pin
      name: 가는 핀
      desc: 옷 안쪽에 숨겨 둔 가늘고 단단한 핀.
      hidden: true

