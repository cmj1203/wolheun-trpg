facts:
  - if: "flag:후드_벗음"
    text: 아시나는 이미 후드를 벗어 얼굴을 드러냈다. 후드를 벗는 장면은 다시 쓰지 않는다.
    forbid: [후드를 벗, 후드가 벗겨, 후드를 젖, 후드를 걷, 후드를 내리, 후드가 흘러내]
  - if: "!flag:후드_벗음"
    text: 아시나는 후드를 깊이 눌러쓰고 있다. 얼굴은 반쯤 가려져 있다.
    forbid: []
  - if: "!item:magic_bag"
    text: 마법 가방은 빼앗겨 지금 아시나에게 없다.
    forbid: [가방에서, 가방을 열, 가방을 뒤]
  - if: "!item:map"
    text: 낡은 지도는 지금 아시나에게 없다.
    forbid: [지도를 펼, 지도를 꺼]
  - if: "flag:미소녀"
    text: 아시나는 이미 자기를 대륙에서 하나뿐인 미소녀라고 내세웠다.
    forbid: []

free_defaults:
  neutral:
    hit:
      - 나레이션: 붉은 눈이 나를 한참 훑어보았다. 아까보다는 덜 차가운 눈빛이었다.
    mixed:
      - 나레이션: 남자는 대꾸 없이 나를 재는 듯 내려다보았다.
    miss:
      - 나레이션: 붉은 눈이 한층 더 차갑게 가라앉았다.
  talk_fallback:
    - 남자: 쓸데없는 소리다. 묻는 말에나 답해라.
    - 남자: 하. 그 입은 쉬지를 않는군.
    - 남자: 시간을 끌 셈인가?
  press:
    - 남자: 할 말은 그것뿐인가?
    - 나레이션: 칼끝이 한 치 다가왔다. 더는 기다려 줄 눈치가 아니었다.
  deflect:
    - 남자: 입을 닫아라, 여자. 목숨이 아깝지 않은 모양이군.
    - 남자: 하. 그런 소리로 살아남을 수 있다고 생각하나?
  improv:
    hit:
      gist: 엉뚱한 행동이 남자의 허를 찌른다. 남자는 어이없어하면서도 아시나에게서 눈을 떼지 못한다.
      lines:
        - 나레이션: 어이가 없었는지 남자의 눈썹이 아주 조금 올라갔다.
        - 남자: 하. 별짓을 다 하는군.
          face: smile
      effects: { 집착: 1 }
    mixed:
      gist: 남자는 기가 막힌다는 듯 비웃는다. 흥미는 생겼지만 무슨 속셈인지 더 수상하게 여긴다.
      lines:
        - 남자: 무슨 속셈이지?
          face: wary
        - 나레이션: 비웃음 섞인 목소리였지만, 붉은 눈은 나를 놓치지 않았다.
      effects: { 집착: 1, 의심: 1 }
    miss:
      gist: 엉뚱한 행동은 먹히지 않는다. 남자의 눈빛이 차갑게 식고 호위가 칼자루에 손을 얹는다.
      lines:
        - 나레이션: 호위 하나가 말없이 칼자루에 손을 얹었다.
        - 남자: 지루하군.
          face: wary
      effects: { 의심: 1 }

foreshadow:
  - id: 별
    at: b01_sand
    say: 지도는 낡았어도 별은 그대로야. 밤이 되면 쓸 데가 있을걸.
    words: [별, 지도]
    beats: [r3_dusk]
  - id: 보석
    at: b03_ask
    say: 저 터번의 붉은 보석, 눈에 밟히지? 기억해 둬.
    words: [보석, 터번]
    beats: [b05_why, b08_gaze, r2_bind, r4_prove, r5_claim]

council: [b08_gaze, r2_bind, r3_dusk, r4_prove, r5_claim]

