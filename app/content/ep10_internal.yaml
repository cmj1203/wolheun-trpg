  "facts": [
    {
      "if": "flag:ep10_시작",
      "text": "아시나는 왕의 속마음 상자를 듣지 못했다. c034·c035·c037·c071은 독자에게만 보이는 내면이다. 구김과 그늘, 부모에 대한 태도, 자제력에 관한 왕의 생각을 아시나의 기억으로 쓰지 않는다. 9화 c042의 발화·속마음 구분도 미확정이므로 새 지식으로 넣지 않는다.",
      "state_guard": [
        "왕이 속으로 한 판단을 아시나가 들었다고 쓰지 않는다."
      ]
    },
    {
      "if": "flag:ep10_시작 && !flag:ep10_눈색인지_앎",
      "text": "왕이 눈색 변화를 알아챘는지 아시나는 아직 모른다. 귀찌 원리나 신분을 왕이 안다고 추정하지 않는다.",
      "state_guard": [
        "왕의 눈색 인지를 미리 밝히지 않는다."
      ]
    },
    {
      "if": "flag:ep10_눈색인지_앎",
      "text": "왕은 변한 눈색을 알아챘다고 말했다. 발견 시각과 귀찌 원리·정체를 아는 범위는 미확정이다.",
      "state_guard": [
        "왕이 아시나의 가문과 귀찌 원리를 간파했다고 쓰지 않는다."
      ]
    },
    {
      "if": "flag:ep10_눈마법_풀림",
      "text": "현재 아시나의 머리는 갈색이고 눈은 붉다. 은발은 c014 마법 조정 중의 모습이다. 귀찌 잔여 수치는 이 화 근거로 정하지 않는다.",
      "state_guard": [
        "현재 머리를 은발로 고정하지 않는다."
      ]
    },
