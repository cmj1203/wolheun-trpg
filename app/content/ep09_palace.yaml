  "facts": [
    {
      "if": "flag:ep09_r01",
      "text": "카림이 감시 중이라는 아시나의 추측. 지시자의 실제 명령은 미확인",
      "state_guard": []
    },
    {
      "if": "flag:ep09_r02",
      "text": "청발 수행자의 이름은 나시르",
      "state_guard": []
    },
    {
      "if": "flag:ep09_r03",
      "text": "황제를 향해 시하드시여라고 부르는 호칭. 제도 설명을 자동 추가하지 않음",
      "state_guard": []
    },
    {
      "if": "flag:ep09_r04",
      "text": "황제가 짐의 잠금 마법을 이미 보고받았다",
      "state_guard": []
    },
    {
      "if": "flag:ep09_r05",
      "text": "황제가 요구 수락을 승인했다. 아직 짐은 반환되지 않았다",
      "state_guard": []
    },
    {
      "if": "flag:ep09_r06",
      "text": "나시르는 크롬웰 정보를 원한다. 이번 화에서 출신을 처음 자백한 장면이 아님",
      "state_guard": []
    },
    {
      "if": "flag:ep09_r08",
      "text": "무의 사디운과 문의 아스타테아가 황가를 비호한다는 설명",
      "state_guard": []
    },
    {
      "if": "flag:ep09_r10",
      "text": "나시르는 원하는 만큼 이야기를 들을 때까지 짐을 주지 않는다",
      "state_guard": []
    },
    {
      "if": "flag:ep09_r11",
      "text": "수르트는 북대륙과 남대륙 사이의 소도시. 거기까지 가는 방법은 아직 없음",
      "state_guard": []
    },
    {
      "if": "flag:ep09_r13",
      "text": "누군가 높은 곳의 자신을 알아챈 듯한 시선을 느낀다",
      "state_guard": []
    }
  ],
