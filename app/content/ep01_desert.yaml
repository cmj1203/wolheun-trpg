        - { id: man_wait, tag: 시간, weight: soft, text: 남자가 손가락으로 칼자루를 두드리며 기다렸다. 해가 기운다., effects: { 귀찌: -1 } }
        - { id: sand_edge, tag: 자리, weight: soft, spoken: true, text: 설명하다 뒷걸음질쳐 모래 비탈 가장자리에 섰다., effects: { flags: { 자리_트임: true } } }
        - { id: half_heard, tag: 수치, weight: soft, spoken: true, text: 말이 꼬여 절반만 전해졌다., effects: { 의심: 1 } }
