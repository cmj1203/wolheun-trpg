facts:
  - if: "flag:후드_벗음"
    text: 아시나는 이미 후드를 벗어 얼굴을 드러냈다. 후드를 벗는 장면은 다시 쓰지 않는다.
    state_guard: [후드를 벗, 후드가 벗겨, 후드를 젖, 후드를 걷, 후드를 내리, 후드가 흘러내]
  - if: "!flag:후드_벗음"
    text: 아시나는 후드를 깊이 눌러쓰고 있다. 얼굴은 반쯤 가려져 있다.
    state_guard: []
    state_check:
      about: [후드, 두건, 쓰개, 머리카락, 머리칼, 은발, 맨얼굴, 얼굴]
      ask: 이 글에서 아시나의 후드가 벗겨지거나 흘러내리거나 젖혀져서, 가려져 있던 머리나 얼굴이 드러났는가? 후드를 쓴 채 움켜쥐거나 여미거나 그 그늘 아래에서 보는 것, 남자가 후드를 벗기려다 못 벗긴 것은 드러난 것이 아니다.
      sets: 후드_벗음
  - if: "flag:신분_노출"
    text: 아시나가 자기 입으로 웰든 공녀라고 밝혔다. 남자는 그 말을 들었고, 더는 길 잃은 여행자로 보지 않는다.
    state_guard: []
  - if: "!item:magic_bag"
    text: 마법 가방은 빼앗겨 지금 아시나에게 없다.
    # 소지품 보유는 엔진 상태(item)라 남긴다.
    state_guard: [가방에서, 가방을 열, 가방을 뒤]
  - if: "!item:map"
    text: 낡은 지도는 지금 아시나에게 없다.
    state_guard: [지도를 펼, 지도를 꺼]
  - if: "flag:미소녀"
    text: 아시나는 이미 자기를 대륙에서 하나뿐인 미소녀라고 내세웠다.
    state_guard: []
  # 19-F 장면 검사 사건. GM 이 그 판에 일어난 일을 알고 서술하게 한다(플래그는 판 끝까지 남으니 지난 일로 적는다).
  - if: "flag:거리_가까움"
    text: 바람이 바뀌어 세 사람의 말소리가 띄엄띄엄 들렸다. 생각보다 가깝지만 말을 주고받을 거리는 아니었다.
    state_guard: []
  - if: "flag:눈부심"
    text: 한낮의 모래빛에 눈이 부셔 세 사람의 그림자가 흔들려 보였다.
    state_guard: []
  - if: "flag:모래바람"
    text: 모래바람을 맞아 바위 뒤에서 한참 버텼고, 발자국이 지워졌다.
    state_guard: []
  - if: "flag:가방_끈 && item:magic_bag"
    text: 마법 가방의 끈이 끊어져 아시나는 가방을 손으로 쥐고 다닌다.
    state_guard: []
  - if: "flag:바위_온기"
    text: 해 질 녘 찾은 바위 그늘에 낮의 온기가 남아 있었다.
    state_guard: []
  - if: "flag:별_가림"
    text: 해 질 녘 구름이 몰려와 첫 별을 가렸다.
    state_guard: []
  - if: "flag:짐승_소리"
    text: 해 질 녘 멀리서 짐승 울음이 두 번 들렸고, 두 번째가 더 가까웠다.
    state_guard: []
  - if: "flag:발자국"
    text: 해 질 녘 모래 위에서 아직 지워지지 않은 사람 발자국을 봤다. 누구의 것인지는 모른다.
    state_guard: []

free_defaults:
  neutral:
    hit:
      - 나레이션: 붉은 눈이 나를 한참 훑어보았다. 아까보다는 덜 차가운 눈빛이었다.
    mixed:
      - 나레이션: 남자는 대꾸 없이 나를 재는 듯 내려다보았다.
    miss:
      - 나레이션: 붉은 눈이 한층 더 차갑게 가라앉았다.
  talk_fallback:
    - 남자: 쓸데없는 소리다. 묻는 말에나 답해라.
    - 남자: 하. 그 입은 쉬지를 않는군.
    - 남자: 시간을 끌 셈인가?
  press:
    - 남자: 할 말은 그것뿐인가?
    - 나레이션: 칼끝이 한 치 다가왔다. 더는 기다려 줄 눈치가 아니었다.
  deflect:
    - 남자: 입을 닫아라, 여자. 목숨이 아깝지 않은 모양이군.
    - 남자: 하. 그런 소리로 살아남을 수 있다고 생각하나?
  improv:
    hit:
      gist: 입력한 행동이 뜻대로 통해 남자의 허를 찌른다. 남자는 물러서지 않지만 아시나에게서 눈을 떼지 못한다.
      lines:
        - 나레이션: 어이가 없었는지 남자의 눈썹이 아주 조금 올라갔다.
        - 남자: 하. 별짓을 다 하는군.
          face: sneer
      effects: { 집착: 1 }
    mixed:
      gist: 입력한 행동은 통하지만 남자는 곧 정신을 차리고 비웃는다. 흥미는 생겼고, 무슨 속셈인지 더 수상하게 여긴다.
      lines:
        - 남자: 무슨 속셈이지?
          face: wary
        - 나레이션: 비웃음 섞인 목소리였지만, 붉은 눈은 나를 놓치지 않았다.
      effects: { 집착: 1, 의심: 1 }
    miss:
      gist: 입력한 행동은 먹히지 않는다. 남자의 눈빛이 차갑게 식고 호위가 칼자루에 손을 얹는다.
      lines:
        - 나레이션: 호위 하나가 말없이 칼자루에 손을 얹었다.
        - 남자: 지루하군.
          face: neutral
      effects: { 의심: 1 }
  # 상대가 지나칠 수 없는 큰 행동(몸에 닿기, 겨누기). 수치는 improv 의 두 단계(근거: 베히다트 가치관 2·4 — 살릴지는 흥미로만 정하고 흥미가 생기면 집요해진다 → 집착 2; 호감은 원작에서 b09 뒤에야 생기므로 1; 실패는 의심 2).
  improv_bold:
    hit:
      gist: 뜻밖의 큰 행동이 그대로 이뤄진다. 남자는 아주 잠깐 굳었다가 비웃음도 없이 아시나를 빤히 내려다본다. 칼은 거두지 않지만 죽일 마음이 한 발 물러나고, 흥미가 집요함으로 바뀐다.
      lines:
        - 나레이션: 남자의 눈이 아주 잠깐 멈췄다. 비웃음은 나오지 않았다.
        - 남자: ……미친 여자군.
        - 나레이션: 붉은 눈이 나에게서 떨어지지 않았다.
      effects: { 집착: 2, 호감: 1, flags: { 큰_행동: true } }
    mixed:
      gist: 큰 행동은 이뤄지지만 남자는 곧 정신을 차리고 더 수상하게 여긴다. 허를 찔린 것이 불쾌해 손이 칼자루로 간다. 흥미와 의심이 함께 커진다.
      lines:
        - 남자: …무슨 속셈이지?
          face: wary
        - 나레이션: 남자의 손이 칼자루를 고쳐 쥐었다. 그러나 붉은 눈은 나에게서 떨어지지 않았다.
      effects: { 집착: 2, 의심: 2, flags: { 큰_행동: true } }
    miss:
      gist: 큰 행동은 먹히지 않는다. 남자는 아시나의 손목을 붙잡아 멈춰 세우고, 눈빛이 얼음처럼 식는다. 호위가 칼자루에 손을 얹는다.
      lines:
        - 나레이션: 남자가 내 손목을 붙잡아 멈춰 세웠다. 붉은 눈이 얼음처럼 식었다.
        - 남자: 죽기 직전인 주제에 겁이 없군.
          face: wary
      effects: { 의심: 2, flags: { 큰_행동: true } }

