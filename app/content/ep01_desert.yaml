        - 귀찌 변장이 풀리거나 은발이 드러난다
        - 남자가 칼을 완전히 거두고 친절해진다
        - 일행의 목적지나 정체가 밝혀진다
      state_guard: [모래바닥에 묶]
      echo_only: [웰든, 리세아, 훤하, 미소녀, 시세, 뭐든]
