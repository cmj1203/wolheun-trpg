        fx: shake
      - 남자: ……
      - 나레이션: 남자는 품에서 물주머니를 꺼내 내 발치에 던졌다.
        sfx: 툭
      - 남자: 죽는 것도, 살아남는 것도 네 몫이다. 여자.
