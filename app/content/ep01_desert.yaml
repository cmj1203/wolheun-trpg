        - { id: water_spill, tag: 소지품, weight: soft, text: 물통이 기울어 몇 방울이 모래에 스몄다., effects: { flags: { 물_적음: true } } }
        - { id: dune_slide, tag: 자리, harm: 몸, weight: soft, text: 모래 비탈이 무너져 아래로 미끄러졌다., effects: { 체력: -1, flags: { 자리_낮음: true } } }
        - { id: sand_eyes, tag: 수치, harm: 몸, weight: soft, text: 모래바람에 눈이 따가워 걸음이 느려졌다., effects: { 체력: -1, flags: { 눈_따가움: true } } }
        - { id: map_lost, tag: 소지품, weight: hard, text: 바람이 지도를 낚아채 어둠 속으로 날려 버렸다., effects: { lose: [map] }, if: "item:map" }
        - { id: cold_night, tag: 수치, harm: 몸, weight: hard, text: 추위에 손끝이 굳어 한참을 웅크렸다., effects: { 체력: -1, 귀찌: -1, 탈주: -1 } }
      aim: 오늘 밤을 버티고 크라차 쪽으로 계속 걷는다.
      situation: 아시나는 홀로 사막을 걷고 있다. 해가 지고 추위와 갈증이 몰려온다. 주위에는 아무도 없다.
      goal: 아시나가 밤을 버틸 방법을 찾고 크라차 쪽으로 계속 걷는다.
      speakers: [나레이션, 속마음]
      must_not:
        - 다른 사람이 나타난다
        - 아시나가 죽거나 크게 다친다
        - 귀찌 변장이 풀리거나 은발이 드러난다
