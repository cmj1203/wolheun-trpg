        - { id: guard_grab, tag: 상대행동, harm: 몸, weight: hard, text: 호위가 아시나의 팔을 붙들어 앞으로 끌어냈다., effects: { 체력: -1, 의심: 1, flags: { 팔_붙들림: true } } }
      aim: 데려갈 값이 있는 사람이라는 걸 보여 준다.
      situation: 남자가 칼끝을 내리고 아시나에게 쓸모를 증명해 보라고 한다. 호위 둘이 지켜본다. 일행은 사막을 건너는 중이다.
      goal: 아시나가 자기 쓸모를 보여 주고 남자가 데려갈 값이 있는지 잰다.
      speakers: [나레이션, 속마음, 아시나, 남자]
      must_not:
        - 남자가 자기 이름이나 신분을 밝힌다
