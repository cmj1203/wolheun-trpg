      - 남자: 어디서 왔고, 누가 보냈지?
        face: wary
    free:
      nudge:
        - 나레이션: 호위가 붙든 팔에 힘을 주었다.
      prompt: 손목이 묶였다. 뭐라고 답할까요?
      prices:
        - { id: rope_tight, tag: 자리, harm: 몸, weight: soft, text: 호위가 붙든 팔에 힘을 주었다., effects: { 체력: -1, flags: { 팔_붙들림: true } } }
        - { id: man_pace, tag: 상대행동, weight: soft, text: 남자가 답을 기다리며 아시나 주위를 한 바퀴 돌았다., effects: { 의심: 1 } }
        - { id: sun_low, tag: 시간, weight: soft, text: 심문이 길어지는 사이 해가 모래 위로 내려앉았다., effects: { 귀찌: -1 } }
        - { id: bag_search, tag: 소지품, weight: hard, text: 호위가 가방을 뒤집어 짐을 모래에 쏟았다., effects: { 의심: 1, flags: { 짐_쏟음: true } }, if: "item:magic_bag" }
        - { id: word_slip, tag: 수치, harm: 마음, weight: hard, spoken: true, text: 말끝이 떨렸다. 남자의 눈빛이 굳었다., effects: { 정신력: -1, 의심: 2 } }
      aim: 묶인 채 심문을 버티고, 길을 잃었다는 말을 밀고 나간다.
      situation: 아시나는 손목이 묶인 채 남자의 심문을 받는다. 남자는 아시나를 경계한다.
      goal: 아시나가 심문을 어떻게 버티는지 보여 준다. 남자의 의심은 풀리지 않는다.
      speakers: [나레이션, 속마음, 아시나, 남자]
      must_not:
        - 남자가 자기 이름이나 신분을 밝힌다
