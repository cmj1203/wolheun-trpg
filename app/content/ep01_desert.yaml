  r2_bind:
    title: 묶인 손목
    bg: desert_near
    cast: { left: 아시나, right: 남자 }
    lines:
      - 나레이션: 마른 풀 냄새가 나는 밧줄이 눈에 들어왔다. 호위의 칼, 남자의 등, 어깨의 가방.
        if: "item:magic_bag && !flag:가방_끈"
      - 나레이션: 마른 풀 냄새가 나는 밧줄이 눈에 들어왔다. 호위의 칼, 남자의 등.
        if: "!item:magic_bag || flag:가방_끈"
      - 나레이션: 하지만 살려 두는 이유는 따로 있었다. 거친 손이 내 두 팔을 등 뒤로 꺾었다.
      - 남자: 묶어라. 수상한 짓을 하면 그 자리에서 베어도 좋다.
        face: wary
      - 나레이션: 거친 밧줄이 손목을 파고들었다.
        sets: 포박
      - 남자: 말씨는 북쪽이다. 혼자 사막을 건너는 여자도 드물지.
