          keywords: [별, 방향, 지도, 남쪽]
          outcomes:
            hit:
              gist: 남쪽을 찾아 망설임 없이 걷는다.
              lines:
                - 속마음: 저 별이 저쪽이니까… 크라차는 이쪽이야.
                  if: "!flag:별_가림"
                - 속마음: 낮에 봐 둔 쪽이 저기니까… 크라차는 이쪽이야.
                  if: "flag:별_가림"
                - 나레이션: 방향을 알고 걷는 길은 훨씬 덜 막막했다.
              effects: { 탈주: 2 }
            mixed:
              gist: 방향은 대강 잡았지만 먼 길을 돌아 기운이 빠진다.
              lines:
                - 나레이션: 방향은 대강 맞았다. 다만 한참을 돌아온 뒤에야 알아챘다.
              effects: { 탈주: 1, 귀찌: -1 }
            miss:
              gist: 낯선 사막이라 남쪽을 잘못 짚는다. 그 방향으로 걸었지만 같은 자리를 빙빙 돈다. 날씨를 새로 지어내지 않는다.
              lines:
                - 나레이션: 별을 올려다봤지만 이 하늘의 별자리는 낯설었다. 남쪽이라 믿은 쪽으로 걸음을 옮겼다.
                  if: "!flag:별_가림"
                - 나레이션: 낮에 봐 둔 방향은 어둠 속에서 믿을 게 못 됐다. 남쪽이라 믿은 쪽으로 걸음을 옮겼다.
                  if: "flag:별_가림"
                - 나레이션: 모래 언덕을 넘고 또 넘었는데, 낯익은 바위가 다시 나타났다.
                - 속마음: 아까 그 바위잖아…
              effects: { 체력: -1, 귀찌: -1 }
        - id: drink
          label: 남은 물로 버틴다
          stat: 근력
          hint: 남은 물을 조금씩 마시며 걷는다.
          examples: [남은 물을 한 모금 마시고 걷는다]
          keywords: [마신, 마셔, 모금, 물을 마, 물통, 걷는다, 걷고]
          outcomes:
            hit:
              gist: 아껴 둔 물 한 모금으로 다리에 힘이 돌아온다.
              lines:
                - 나레이션: 미지근한 물 한 모금이 온몸으로 퍼졌다. 다리에 다시 힘이 돌았다.
              effects: { 체력: 1, 탈주: 1 }
            mixed:
