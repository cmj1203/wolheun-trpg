    - { id: verdict, col: 3, row: 3, beats: [b09_verdict], hints: ["칼을 넘기고 눈이 마주친 다음에 정해져.", "그 사람 눈을 피할지 말지 골라 봐."] }
    - { id: claim, col: 2, row: 0, beats: [r5_claim], hints: ["칼끝이 목에 닿았을 때 갈라져.", "네가 얼마나 대단한 집안 사람인지 내세워 봐."] }
    - { id: prove, col: 2, row: 1, beats: [r4_prove], hints: ["칼끝이 목에 닿았을 때 갈라져.", "살려 두면 뭐가 좋은지 말해 보면 어때?"] }
    - { id: bind, col: 3, row: 2, beats: [r2_bind], hints: ["끝에 그 사람이 널 어떻게 보느냐로 갈려.", "수상하게 굴수록 이쪽으로 가까워져."] }
    - { id: dusk, col: 2, row: 5, beats: [r3_flee, r3_slip, r3_dusk], hints: ["사람을 본 순간이나 칼끝 앞에서 갈라져.", "맞서지 말고 달아나 봐."] }
    - { id: value, col: 4, row: 0, beats: [e_value], ending: true, hints: ["칼끝이 목에 닿았을 때 갈라져.", "네가 얼마나 대단한 집안 사람인지 내세워 봐."] }
    - { id: deal, col: 4, row: 1, beats: [e_deal], ending: true, hints: ["칼끝이 목에 닿았을 때 갈라져.", "살려 두면 뭐가 좋은지 말해 보면 어때?"] }
    - { id: spy, col: 4, row: 2, beats: [e_spy], ending: true, hints: ["끝에 그 사람이 널 어떻게 보느냐로 갈려.", "수상하게 굴수록 이쪽으로 가까워져."] }
    - { id: curious, col: 4, row: 3, beats: [e_curious], ending: true, hints: ["칼을 넘기고 눈이 마주친 다음에 갈라져.", "그 사람 눈길을 끝까지 붙잡아 봐."] }
    - { id: survivor, col: 4, row: 4, beats: [e_survivor], ending: true, hints: ["칼을 넘기고 눈이 마주친 다음에 갈라져.", "너무 튀지 말고 조용히 넘겨 봐."] }
