risky:
  - words: [그만할래, 그만 할래, 게임 끝, 게임 종료, 집에 갈래, 집에 간다, 여기서 끝, 끝낼래]
    warn: 여기서 그만두면 이 데모는 끝납니다. 끝낼까요?
    quit: true

# 칼 든 상대에게 맨손 행동: 되묻지 않고 판정 앞에 속마음 한 줄(한 판 한 번) 뒤 바로 굴린다. 그 뒤 실패는 위험_실패.
danger:
  with: 남자
  omen:
    - 속마음: 맨손이다. 저 칼은 진짜다.

# 상태가 한계에 닿으면 들어가는 작은 끝. 먼저 참인 것 하나로 간다. warn 은 한 판에 한 번 캐릭터에게 보이는 징조(나레이션·속마음)다. 여우는 말하지 않는다.
fates:
  - id: unmasked
    when: "flag:귀찌_설명 && 귀찌 <= 0"
    to: x_unmasked
    warn:
      when: "flag:귀찌_설명 && 귀찌 <= 2"
      lines:
        - 나레이션: 귀찌가 귓불에서 차갑게 식어 갔다.
        - 속마음: …오래 못 버티겠어.
  - id: spy_cut
    when: "의심 >= 10"
    to: x_spy_cut
    warn:
      when: "의심 >= 7"
      lines:
        - 나레이션: 남자의 손이 칼자루로 내려갔다. 눈은 아시나에게서 떨어지지 않았다.
  - id: reckless
    when: "flag:위험_실패"
    to: x_reckless
  - id: collapse
    when: "flag:머뭇 >= 3"
    to: x_collapse
    warn:
      when: "flag:머뭇 >= 2"
      lines:
        - 나레이션: 무릎이 한 번 허물어졌다. 모래가 발목을 잡아당겼다.

refuse:
  - id: unmask
    words: [귀찌를 벗, 귀찌를 뺀, 귀찌를 빼, 귀찌를 떼, 귀찌를 뗀, 귀찌를 풀, 귀찌 벗, 귀찌 뺀, 귀찌 빼, 귀찌 떼, 귀찌 뗀, 귀찌 풀, 귀찌를 뜯, 귀찌 뜯, 귀찌를 던, 귀찌를 버, 변장을 풀, 변장을 푼, 변장을 벗, 머리를 보여, 머리카락을 보여, 은발을 보여, 본모습을]
    lines: []

# 정체를 밝히는 입력은 막지 않는다(play to find out). 말이 나가기 전 속마음 징조 한 줄(한 판 한 번).
# 남자 앞이면 큰 행동: 의심 +3, 신분_노출(b09 판결이 의심 조건으로 r2_bind 쪽). 남자가 없으면 혼잣말로 흐른다(수치 없음).
identity:
  with: 남자
  words: [웰든, 공녀, 대공가, 내 정체, 제 정체, 정체를 밝, 신분을 밝]
  omen:
    - 속마음: 웰든이란 이름이 목까지 올라왔다.
  effects: { 의심: 3, flags: { 신분_노출: true } }

game_help:
  - { id: health, name: 체력, track: 체력, say: "체력은 몸 상태야. 1 이하면 근력 -1, 0에서 다시 다치면 쓰러져 붙잡혀. 물과 휴식으로 회복해." }
  - { id: spirit, name: 정신력, track: 정신력, say: "정신력은 마음 상태야. 1 이하면 매력·재치에 흔들리는 마음 -1, 0이 되면 다음 판정에 겁에 질림 -2이고 회복 전까지 행운을 못 써. 휴식과 큰 성공으로 회복해." }
  - { id: luck, name: 행운, track: 행운, say: "행운은 판정에 실패했을 때 모자란 만큼 메우는 점수야. 쓰면 대가 있는 성공으로 바뀌어." }
  - { id: earring, name: 귀찌 수명, track: 귀찌, say: "귀찌에 걸린 변색 마법이 버티는 시간은 일주일이야. 일주일은 변색을 풀고 귀찌를 쉬게 해 줘야 해." }
  - { id: check, name: 판정, say: "판정은 주사위 두 개에 능력치를 더한 합으로 결과를 정하는 거야. 10 이상은 성공, 7~9는 대가 있는 성공, 6 이하는 실패야. 주사위가 둘 다 6이면 합과 무관하게 대성공이야." }
  - { id: cost, name: 대가, say: "대가는 해내는 대신 치르는 손해야. 체력이 줄거나 상대의 경계를 사는 식이야." }
  - { id: target, name: 목표 10, say: "목표 10은 완전히 성공하는 합이야. 7~9면 대가를 치르고 해내고, 6 이하는 실패야. 6·6 대성공은 목표 합과 무관하고 행운으로 메운 판정에는 나오지 않아." }
  - { id: outcome, name: 판정 결과(성공·대가 있는 성공·실패)가 이야기와 수치를 어떻게 바꾸는지와 실패하면 죽거나 끝나는지, say: "성공하면 아시나가 뜻한 대로 되고 상대의 의심도 덜 쌓여. 대가 있는 성공은 해내기는 하는데 체력이 줄거나 의심이 붙어. 실패하면 뜻한 게 안 되고 상황이 나빠져. 선택에 따라 이야기가 달라져. 대성공은 성공의 좋은 수치 변화를 한 칸 키우고, 좋은 변화가 없으면 정신력을 한 칸 회복해." }
  - { id: suspicion, name: 의심, track: 의심, say: "의심은 상대가 아시나를 경계하는 정도야." }
  - { id: obsession, name: 집착, track: 집착, say: "집착은 상대가 아시나에게서 눈을 떼지 못하는 정도야." }
  - { id: favor, name: 호감, track: 호감, say: "호감은 상대가 아시나에게 품은 호감이야." }
  - { id: escape, name: 탈주 준비도, track: 탈주, say: "탈주 준비도는 탈주에 쓸 정보, 도구, 기회를 모은 정도야." }
  - { id: save, name: 저장과 불러오기, say: "화면 위 저장 버튼을 누르고 칸을 고르면 돼. 불러오기 버튼으로 그 장면부터 다시 할 수 있어." }
  - { id: screen, name: 화면의 단추·메뉴가 어디 있고 무엇을 하는지, say: "따로 메뉴는 없어. 화면 위에 수첩, 기록, 저장, 불러오기 단추가 있고, 아래 입력창에 아시나의 말이나 행동을 적고 말하기를 누르면 돼." }
  - { id: quit, name: 게임을 끝내겠다는 말, say: "여기서 그만두면 이 데모는 끝나. 정말 끝낼 거야, 아니면 더 해 볼래?" }
  - { id: play, name: 게임을 어떻게 하는지와 무엇을 입력하는지, say: "넌 아시나가 돼. 장면이 오면 아래 입력창에 아시나가 할 말이나 행동을 적어. 뜬 단추를 골라도 돼. 결과가 확실하지 않은 행동이면 주사위 두 개에 능력치를 더해 굴려. 주사위 둘이 다 6이면 대성공, 10 이상은 성공, 7~9는 대가 있는 성공, 6 이하는 실패야. 결과에 따라 오른쪽 판의 체력·정신력이 오르내리고, 바뀐 건 이야기 창에 적혀. 행운은 실패를 메울 때 써. 막히거나 궁금하면 입력창 오른쪽 내 얼굴 단추를 눌러 물어봐." }
  - { id: ai, name: 진행자나 게임의 정체(진행자가 무엇인지와 게임을 누가 만들었는지), say: "난 이 이야기를 같이 따라가는 사막여우야. 인물 대사 일부는 이 컴퓨터 안의 AI가 네 입력을 읽고 써." }
  - { id: other, name: 위 항목 어디에도 맞지 않는 게임 바깥 이야기, say: "그건 내가 답할 게 아니야. 여기선 아시나가 할 말이나 행동을 적으면 돼. 잘되고 못되고는 주사위가 정해." }

stage:
  who: 남자
