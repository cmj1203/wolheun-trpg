        - 아시나가 크게 다치거나 죽는다
        - 호위가 말을 한다
        - 귀찌 변장이 풀리거나 은발이 드러난다
        - 아시나가 풀려난다
        - 호위가 아시나를 때리거나 해친다
      state_guard: []
      echo_only: [웰든, 리세아, 친척, 장사, 상단, 미소녀]
      idle:
        threat: true
        lines:
          - 나레이션: 호위가 밧줄을 들고 다가왔다.
          - 나레이션: 먼저 풀린 건 다리였다. 남자는 시시하다는 듯 등을 돌렸다.
        effects: { 의심: 1 }
