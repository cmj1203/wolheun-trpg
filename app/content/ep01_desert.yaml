                - 나레이션: 말이 꼬일수록 붉은 눈은 더 차가워졌다.
              effects: { 의심: 1 }
        - id: cover
          label: 그럴듯하게 둘러댄다
          stat: 재치
          hint: 상인이나 순례자 같은 거짓 사정을 지어낸다.
          examples: [크라차에 친척을 만나러 가는 길이에요]
          keywords: [상인, 친척, 순례, 장사, 심부름, 거짓]
          outcomes:
            hit:
              gist: 이야기에 빈틈이 없어 남자가 잠시 말을 멈춘다. 믿지는 않는다.
              lines:
                - 아시나: 크라차에 사는 친척을 만나러 가는 길이에요. 물어보면 알 거예요.
                - 나레이션: 남자는 잠시 말이 없었다.
              effects: { 탈주: 1 }
            mixed:
              gist: 그럴듯했지만 남자가 작은 빈틈 하나를 집어낸다.
              lines:
                - 아시나: 크라차에 친척이 있어요!
                - 속마음: …아차.
                  tie: true
              effects: {}
            miss:
