          gist: 입력한 행동이 뜻대로 통한다. 아시나는 다시 움직일 힘을 낸다.
          lines:
            - 나레이션: 어이없는 짓이었지만, 이상하게도 기운이 조금 돌아왔다.
            - 속마음: 좋아, 아직 이럴 힘은 남았네.
          effects: { 탈주: 1 }
        mixed:
          gist: 입력한 행동은 통하지만 아까운 시간과 기운을 썼다.
          lines:
            - 나레이션: 잠깐 기분은 나아졌지만, 그만큼 해가 기울고 목이 말랐다.
          effects: { 귀찌: -1 }
        miss:
          gist: 입력한 행동은 뜻대로 되지 않고 기운만 빠진다. 모래 위에 그대로 주저앉는다.
          lines:
            - 나레이션: 아무 소용도 없었다. 나는 모래 위에 그대로 주저앉았다.
            - 속마음: 내가 지금 뭘 하는 거야…
          effects: { 귀찌: -1 }
      idle:
        threat: false
        lines:
          - 나레이션: 아무 소용도 없었다. 나는 모래 위에 그대로 주저앉았다.
          - 속마음: 내가 지금 뭘 하는 거야…
        effects: { 귀찌: -1 }
      default_approach: read
      approaches:
        - id: read
          risky: true
          label: 방향을 가늠해 길을 잡는다
          stat: 교양
          mods:
            - { if: "flag:지도_찢김", value: -1, label: 찢긴 지도 }
            - { if: "flag:별_가림", value: -1, label: 별을 가린 구름 }
            - { if: "flag:발자국", value: 1, label: 남의 발자국 }
          hint: 별이나 낮에 읽어 둔 방향으로 크라차 쪽을 잡는다.
