beats:
  b00_open:
    title: 여는 글
    bg: desert_wide
    lines:
      # 원작 1화 c001~c004: 글은 원작 자막 경계대로 나눠 컷마다 넣고, c004(목에 닿은 칼날)는 대사 없는 한 박자다.
      - 나레이션: 꿈에도 몰랐다. 거대한 태양 아래,
        cg: cg_open_sun
      - 나레이션: 고국이 아닌 낯선 땅에서
        cg: cg_open_land
      - 나레이션: 죽음을 맞이하게 될 줄은―
        cg: cg_open_dark
      - 나레이션: ""
        cg: cg_open_blade
      - 나레이션: 북대륙의 패자라고 불리는 크롬웰 제국.
        cg: cg_cromwell
      - 나레이션: 나는 그곳에서 뭐 하나 부족함 없는 삶을 살았다.
        cg: cg_cromwell
      - 나레이션: 거대한 저택, 아름다운 드레스, 화려한 보석…
        cg: cg_manor
      - 나레이션: 하지만 나의 가슴을 뛰게 하는 것은 따로 있었다.
        cg: cg_manor
      - 아시나: 와아…
        cg: cg_hill
      - 나레이션: 내가 태어난 이 세상을 모험하는 것.
        cg: cg_hill
      - 나레이션: 선사시대 유적지부터 사이베리아의 펜족에게까지…
        cg: cg_travel_3cuts
      - 나레이션: 어느새 난 북대륙의 모든 나라를 둘러보았고, 남대륙으로 향하는 건 당연한 수순이었다.
        cg: cg_travel_3cuts
      - 나레이션: 그렇게 남대륙의 크라차로 가기 위해 사막을 횡단하던 중이었다―
      - 속마음: 살아서 이 사막을 건너야 해. 정체도 들키면 안 되고.
    next: b01_sand

  b01_sand:
    title: 길 잃은 지 일주일
    cut: PSD 001, 005
    bg: desert_wide
    cast: { center: 아시나 }
    lines:
      - 나레이션: 뜨거운 모래 냄새가 코끝을 찔렀다. 허리춤의 물통, 가방 속 낡은 지도, 귓불의 귀찌.
      - 아시나: 하아…
        sfx: 휘이이잉
      - 아시나: 하아…
      - 속마음: 길을 헤맨 지 벌써 일주일째야…
      - 속마음: 사방이 온통 모래뿐이라 길을 알 수가 없어…
      - 속마음: 심지어 물도 다 떨어져 가고…
        cg: cg_drink
        sfx: 꿀꺽
        face: wary
    next: b02_people

  b02_people:
    title: 사람?!
    cut: PSD 005~006
    bg: desert_meet
    cast: { center: 아시나 }
    time: 1
    # 19-F 장면 검사(Mythic 장면 검사를 d6 으로): 장면 시작 때 d6 ≤ 긴장이면 홀수 → altered(장면 줄 뒤에 다른 결), 짝수 → interrupt(장면 줄 앞에 끼어드는 일).
    # 남자를 만나기 전 사막 장면 2곳(b02_people·r3_dusk)에만 둔다(사용자 답 11-04). 사건이 세우는 플래그는 이 장면 접근법의 mods 가 읽는다.
    twist:
      altered:
        - id: closer
          lines:
            - 나레이션: 바람이 방향을 바꿨다. 세 사람의 말소리가 끊어질 듯 이어져 들렸다. 생각보다 가까웠다.
            - 속마음: …이 거리면 숨을 데가 없어.
          effects: { flags: { 거리_가까움: true } }
        - id: glare
          lines:
            - 나레이션: 해가 정수리 위에 섰다. 모래가 빛을 되쏘아 눈을 뜨기 힘들었다. 세 사람의 그림자가 아지랑이 속에서 흔들렸다.
          effects: { flags: { 눈부심: true } }
      interrupt:
        - id: sandstorm
          lines:
            - 나레이션: 모래바람이 덮쳤다. 후드를 움켜쥐고 바위 뒤에 웅크린 채 한참을 버텼다.
            - 나레이션: 바람이 걷히자 발자국이 모두 지워져 있었다. 해는 그새 한 뼘 기울어 있었다.
          effects: { 귀찌: -1, flags: { 모래바람: true } }
        - id: strap
          lines:
            - 나레이션: 마법 가방의 끈이 툭 끊어졌다. 쏟아진 짐을 주워 담느라 손이 모래투성이가 됐다.
            - 속마음: 지도… 지도는 있어. 끈은 손으로 쥐고 가자.
          effects: { flags: { 가방_끈: true } }
    lines:
      - 나레이션: 바람에 낯선 냄새가 섞여 왔다. 왼쪽엔 모래 언덕, 오른쪽엔 바위 그늘.
      - 아시나: 응?
        face: surprised
        sfx: 흠칫
      - 아시나: 저건…
      - 아시나: 사람?!
        face: surprised
    free:
      nudge:
        - 나레이션: 멀리 세 사람의 그림자가 움직이기 시작했다. 곧 시야에서 사라질 것 같았다.
      prompt: 저들이 모래언덕 너머로 사라지기 전에 정해야 한다.
      prices:
        - { id: sun, tag: 시간, harm: 몸, weight: soft, text: 해가 한 뼘 더 기울었다., effects: { 체력: -1, 귀찌: -1 } }
        - { id: map_wind, tag: 소지품, weight: soft, text: 바람에 지도 한 귀퉁이가 찢겨 날아갔다., effects: { flags: { 지도_찢김: true } } }
        - { id: open_sand, tag: 자리, weight: soft, text: 바위 그늘을 벗어나 트인 모래 위에 서 버렸다. 숨을 데가 없다., effects: { flags: { 자리_트임: true } } }
        - { id: foe_look, tag: 상대행동, weight: soft, text: 셋 중 하나가 걸음을 멈추고 이쪽을 똑바로 본다., effects: { 의심: 1 } }
        - { id: foe_approach, tag: 상대행동, weight: hard, text: 세 사람이 먼저 이쪽으로 방향을 틀었다. 거리는 이제 그들이 정한다., effects: { 의심: 2, flags: { 상대_먼저: true } } }
        - { id: sand_fall, tag: 수치, harm: 몸, weight: hard, text: 모래에 무릎까지 빠져 기운이 빠졌다., effects: { 체력: -1, 귀찌: -1, 탈주: -1 } }
      aim: 저 사람들에게 다가갈지, 먼저 살필지, 피해 갈지 정한다.
      situation: 사막 저편에 사람 셋이 보인다. 아시나는 일주일 만에 사람을 본다. 아직 그들과 멀리 떨어져 있어 말이 닿지 않는다.
      goal: 아시나가 그 사람들에게 다가갈지, 살필지, 피할지 정한다.
      speakers: [나레이션, 속마음, 아시나]
      must_not:
        - 세 사람이 말을 걸거나 칼을 뽑는다
        - 아시나가 그들의 이름이나 신분을 알아낸다
        - 귀찌 변장이 풀리거나 은발이 드러난다
        - 크라차에 도착한다
      state_guard: []
      echo_only: [웰든, 리세아, 공녀, 대공, 미소녀]
      neutral:
        hit:
          - 나레이션: 숨을 고르자 조금은 버틸 만해졌다.
        mixed:
          - 나레이션: 버티긴 했지만 그만큼 기운이 빠졌다.
        miss:
          - 나레이션: 아무것도 나아지지 않았다.
      talk_fallback:
        - 속마음: 저 사람들, 신기루는 아니겠지? 헛소리 그만하고 어떻게 할지나 정하자.
        - 속마음: 사람이야, 사람! 이럴 때가 아니잖아.
      press:
        - 나레이션: 해는 기다려 주지 않았다. 이러고 있을 시간이 없었다.
      deflect:
        - 속마음: …더위를 먹었나 봐. 정신 차려, 아시나.
      improv:
        hit:
          gist: 입력한 행동이 뜻대로 통한다. 아시나는 다시 움직일 힘을 낸다.
          lines:
            - 나레이션: 어이없는 짓이었지만, 이상하게도 기운이 조금 돌아왔다.
            - 속마음: 좋아, 아직 이럴 힘은 남았네.
          effects: { 탈주: 1 }
        mixed:
          gist: 입력한 행동은 통하지만 아까운 시간과 기운을 썼다.
          lines:
            - 나레이션: 잠깐 기분은 나아졌지만, 그만큼 해가 기울고 목이 말랐다.
          effects: { 귀찌: -1 }
        miss:
          gist: 입력한 행동은 뜻대로 되지 않고 기운만 빠진다. 뜨거운 모래 위에 그대로 주저앉는다.
          lines:
            - 나레이션: 아무 소용도 없었다. 나는 뜨거운 모래 위에 그대로 주저앉았다.
            - 속마음: 내가 지금 뭘 하는 거야…
          effects: { 귀찌: -1 }
      idle:
        threat: false
        lines:
          - 나레이션: 세 사람이 먼저 이쪽으로 방향을 틀었다. 거리는 이제 그들이 정한다.
        effects: { 의심: 2, flags: { 상대_먼저: true } }
      default_approach: run
      addressed: run
      approaches:
        - id: run
          label: 달려가서 길을 묻는다
          presume: [달려, 뛰어가, 뛰어갔, 내달]
          before: { flags: { 다가감: true } }
          said: { flag: 길_물음, words: [길을, 길 좀, 크라차, 물어, 여쭤, 묻는, 묻고, 아시나요] }
          stat: 근력
          mods:
            - { if: "flag:거리_가까움", value: 1, label: 가까운 거리 }
            - { if: "flag:가방_끈", value: -1, label: 끈 끊긴 가방 }
          hint: 소리치며 달려가 길을 물으려 한다.
          examples: [달려가서 길을 묻는다, 손을 흔들며 소리친다]
          keywords: [달려, 뛰어가, 소리쳐, 저기요, 물어, 묻는다, 다가, 불러, 말 걸, 말을 걸, 말 건다, 흔든다]
          outcomes:
            hit:
              gist: 아시나가 힘을 짜내 달려간다. 살았다는 생각에 웃음이 난다.
              lines:
                - 아시나: 이봐요! 저기요!
                  face: smile
                  sfx: 탓
                - 아시나: 잠시만요!
                  sfx: 타다닷
                - 아시나: 역시 잘못 본 게 아니었어.
                - 아시나: 살았다…!!
                  face: smile
            mixed:
              price: [sun, open_sand]
              gist: 달려가다 모래에 발이 빠져 비틀거리지만 사람들 앞에 닿는다.
              lines:
                - 아시나: 이봐요! 저기요!
                  face: smile
                  sfx: 탓
                - 나레이션: 모래에 발이 푹푹 빠졌다. 그들 앞에 닿았을 땐 숨이 턱까지 차올랐다.
              effects: { 귀찌: -1 }
            miss:
              price: [foe_approach, sand_fall]
              gist: 달려가다 모래에 나동그라진다. 세 사람의 시선이 꽂힌 채 모래투성이로 일어선다.
              lines:
                - 나레이션: 몇 걸음 못 가 모래에 고꾸라졌다. 고개를 드니 세 남자가 나를 내려다보고 있었다.
                  sfx: 콰당
                - 아시나: 하, 하하… 안녕하세요…
              effects: { 체력: -1, 의심: 1 }
        - id: watch
          risky: true
          label: 모래 언덕 뒤에서 먼저 살핀다
          said: { flag: 길_물음, words: [길을, 길 좀, 크라차, 물어, 여쭤, 묻는, 묻고, 아시나요] }
          stat: 재치
          mods:
            - { if: "flag:눈부심", value: -1, label: 눈부신 모래 }
            - { if: "flag:모래바람", value: -1, label: 바람에 흐린 시야 }
          hint: 다가가기 전에 몸을 숨기고 상대를 살핀다.
          examples: [모래 언덕 뒤에서 먼저 살핀다, 숨어서 지켜본다]
          keywords: [살핀, 살펴, 숨어, 숨는, 지켜, 언덕 뒤, 관찰]
          outcomes:
            hit:
              gist: 들키지 않고 세 사람을 살핀다. 보통 신분이 아니라는 걸 알아챈다.
              lines:
                - 나레이션: 세 사람. 가운데 남자의 터번에는 붉은 보석이 박혀 있고, 양옆의 둘은 그를 지키듯 서 있었다.
                - 속마음: 보통 신분은 아니야. 호위가 둘… 한 사람은 복면까지 썼어.
                - 아시나: 저기요! 길 좀 여쭤봐도 될까요?
                  if: "!flag:이미_길_물음"
                  face: smile
              effects: { 탈주: 1, flags: { 정체_눈치: true } }
            mixed:
              gist: 살피다가 붉은 눈과 정확히 마주친다. 숨어 있던 것을 들켰다.
              lines:
                - 나레이션: 가운데 남자의 터번에서 붉은 보석이 번쩍였다. 붉은 눈이 이쪽을 스쳤다 — 숨은 건 들켰지만, 노려보는 눈은 아니었다.
                - 속마음: 봤네…. 그래도 적을 본 눈은 아니야. 웃으면서 나가자.
                  tie: true
                - 아시나: 아, 안녕하세요! 길 좀 여쭤보려고요!
                  if: "!flag:이미_길_물음"
                  face: smile
              effects: { 의심: 1, flags: { 정체_눈치: true } }
            miss:
              gist: 발밑의 모래가 무너져 언덕 아래로 굴러떨어진다. 세 남자의 시선이 꽂힌다.
              lines:
                - 나레이션: 발밑의 모래가 와르르 무너졌다. 나는 언덕 아래로 데굴데굴 굴러떨어졌다.
                  sfx: 와르르
                - 나레이션: 세 남자의 시선이 한꺼번에 꽂혔다.
                - 아시나: 하, 하하… 그게, 길을 좀 물어보려고…
              effects: { 체력: -2, 의심: 2, flags: { 보석_놓침: true } }
        - id: avoid
          label: 몰래 돌아서 피해 간다
          said: { flag: 길_물음, words: [길을, 길 좀, 크라차, 물어, 여쭤, 묻는, 묻고, 아시나요] }
          stat: 재치
          mods:
            - { if: "flag:거리_가까움", value: -1, label: 가까운 거리 }
          hint: 수상한 사람들을 만나지 않으려고 멀리 돌아간다.
          examples: [저 사람들을 피해서 멀리 돌아간다, 모른 척 다른 길로 간다]
          keywords: [피해, 피한다, 돌아간, 돌아서, 다른 길, 모른 척, 몰래 지나, 도망]
          outcomes:
            hit:
              gist: 언덕 그림자를 따라 들키지 않고 세 사람에게서 멀어진다.
              lines:
                - 나레이션: 나는 몸을 낮추고 언덕 그림자를 골라 디뎠다.
                - 속마음: 좋아, 아무도 못 봤어.
              effects: { 탈주: 1, flags: { 도주: true } }
            mixed:
              gist: 돌아가려다 붉은 눈과 마주쳐 들킨다.
              lines:
                - 나레이션: 몇 걸음 못 가 붉은 눈이 이쪽을 스쳤다. 피하려던 건 들켰지만, 쫓아오는 발은 없었다.
                - 속마음: 봤네…. 그래도 쫓아오지는 않아. 길 묻는 척하자.
                  tie: true
                - 아시나: 아, 안녕하세요! 길 좀 여쭤보려고요!
                  if: "!flag:이미_길_물음"
                  face: smile
              effects: { 의심: 1 }
            miss:
              gist: 돌아가다 언덕에서 미끄러져 세 사람 바로 앞으로 떨어진다.
              lines:
                - 나레이션: 발밑의 모래가 무너졌다. 나는 피하려던 사람들 바로 앞으로 굴러떨어졌다.
                  sfx: 콰당
                - 아시나: 하, 하하… 그게…
              effects: { 체력: -1, 의심: 2 }
    next:
      - { if: "flag:도주", to: r3_slip }
      - { to: b03_ask }

  b03_ask:
    title: 길을 물어봤을 뿐인데
    situation: 사막 한복판에서 세 사람과 마주 선 참이다. 남자는 아직 칼을 뽑지 않았다.
    cut: PSD 006
    bg: desert_meet
    cast: { left: 아시나, right: 남자 }
    lines:
      - 나레이션: 그때 등 뒤에서 모래 밟는 소리가 났다. 호위 하나가 내 팔을 붙잡아 세 사람 앞으로 끌어냈다.
        if: "!flag:다가감 && !flag:길_물음"
      - 남자: ……
        face: wary
      - 아시나: 저… 저기…
        face: wary
      - 나레이션: 정말이지 난
      - 아시나: 혹시 크라차까지 가는 길을 아시나요?
        face: smile
        if: "!flag:이미_길_물음"
      - 나레이션: 그저 길을 물어봤을 뿐이었다.
        effects: { 의심: 1, reason: 크라차까지 가는 길을 물음 }
    next: b04_blade

  b04_blade:
    threat: 칼끝
    title: 그리고 현재
    cut: PSD 006~007
    bg: desert_near
    cast: { left: 아시나, right: 남자 }
    effects: { 의심: 2, flags: { 칼끝_만남: true } }
    lines:
      - 나레이션: 그리고 현재.
        cg: cg_now
        sfx: 스릉
        fx: flash
      - 속마음: 크라차에 원수라도 진 건지… 다짜고짜 사람 목에 칼이나 들이대고 말이야!
      - 남자: 마지막으로 할 말은 있나?
        cg: cg_last
        face: menacing
        fx: shake
      - 아시나: 억울해…
        face: indignant
      - 남자: 없다면, 잘 가라.
        sfx: 화악
        face: menacing
        fx: shake
      - 아시나: 잠깐만요, 잠깐! 나 아직 아무 말도 안 했어요!
        face: scared
        sfx: 다급
      - 아시나: 그것 좀 치워봐요! 난 죽이면 안 돼요.
        face: indignant
      - 남자: ……왜지?
        face: wary
    next: b05_why

  b05_why:
    threat: 칼끝
    title: 왜지?
    cut: PSD 007~009
    bg: desert_near
    cast: { left: 아시나, right: 남자 }
    lines: []
    lines:
      - 나레이션: 쇠 냄새가 코앞까지 왔다. 목에 닿은 칼끝, 남자의 터번, 뒤에 선 호위 둘.
    free:
      nudge:
        - 나레이션: 칼끝이 살갗에 닿았다. 남자의 인내심도 슬슬 바닥나는 듯했다.
      offer:
        lines:
          - 나레이션: 남자가 칼끝을 살짝 내렸다. 말할 틈이 생겼다. 그가 다시 들어 올리기 전까지.
      prompt: 왜 죽이면 안 되는지 아시나로서 말하거나 행동해 보세요.
      prices:
        - { id: blade_closer, tag: 자리, harm: 몸, weight: soft, text: 곡도 끝이 살갗을 눌러 피 한 방울이 맺혔다. 고개도 못 돌린다., effects: { 체력: -1, flags: { 칼_밀착: true } } }
        - { id: guard_step, tag: 상대행동, weight: soft, text: 호위 하나가 아시나의 뒤로 돌아가 섰다. 퇴로가 막혔다., effects: { flags: { 퇴로_막힘: true } } }
        - { id: hood_slip, tag: 소지품, weight: soft, if: "!flag:후드_벗음", text: 후드가 어깨 뒤로 흘러내렸다., effects: { 귀찌: -1, flags: { 후드_벗음: true } } }
        - { id: man_doubt, tag: 수치, harm: 마음, weight: soft, text: 남자의 눈이 가늘어졌다., effects: { 정신력: -1, 의심: 1 } }
        - { id: bag_taken, tag: 소지품, weight: hard, text: 호위가 마법 가방을 낚아채 갔다., effects: { 의심: 1, lose: [magic_bag] }, if: "item:magic_bag" }
        - { id: guard_grip, tag: 상대행동, harm: 몸, weight: hard, text: 호위가 아시나의 팔을 붙들었다. 손목이 저릿하다., effects: { 체력: -1, 의심: 1, flags: { 팔_붙들림: true } } }
      aim: 목에 닿은 칼끝을 거두게 할 이유를 댄다.
      situation: 사막 한복판. 붉은 눈의 남자가 곡도 끝을 아시나의 목에 겨누고 있다. 난 죽이면 안 된다는 아시나의 말에 남자가 왜냐고 되물었다. 양옆의 호위 둘은 말없이 지켜본다.
      goal: 아시나가 살아야 할 이유를 대거나 시간을 번다. 남자는 쉽게 믿지 않는다.
      speakers: [나레이션, 아시나, 속마음, 남자]
      must_not:
        - 남자가 자기 이름이나 신분을 밝힌다
        - 남자가 칼을 완전히 거두고 친절해진다
        - 아시나가 크게 다치거나 죽는다
        - 남자가 아시나의 진짜 정체(크롬웰 귀족, 은발에 붉은 눈)를 알아챈다
        - 호위가 말을 한다
        - 장면이 사막을 벗어나거나 다음 사건으로 넘어간다
      state_guard: []
      echo_only: [웰든, 리세아, 공녀, 대공, 미소녀, 상단, 집안, 친척]
      talk_fallback:
        - 남자: 묻는 말에나 답해라.
      press:
        - 남자: 할 말은 그것뿐인가?
          if: "flag:말함_b05_why"
      idle:
        threat: true
        lines:
          - 나레이션: 칼끝이 살갗에 닿았다. 남자의 인내심도 슬슬 바닥나는 듯했다.
          - 나레이션: 호위 하나가 말없이 칼자루에 손을 얹었다.
        effects: { 의심: 1 }
      default_approach: plead
      approaches:
        - id: beauty
          before: { flags: { 후드_벗음: true } }
          said: { flag: 미소녀, words: [미소녀, 미녀, 예쁘, 예쁜, 아름다, 미모, 미인] }
          label: 미인계를 쓴다
          stat: 매력
          hint: 자기 미모와 매력을 내세워 상대의 마음을 흔든다.
          examples:
            - 대륙에서 하나뿐인 미소녀니까요.
            - 후드를 벗고 생긋 웃는다
            - 이렇게 예쁜 사람을 죽이면 아깝잖아요
          keywords: [미소녀, 예쁘, 예쁜, 아름다, 미모, 미인, 후드를 벗, 윙크, 생긋]
          mods:
            - { if: "flag:귀찌_설명 && 귀찌 <= 3", value: -1, label: 귀찌가 불안함 }
          outcomes:
            hit:
              gist: 남자는 어이가 없다는 듯 짧게 되묻는다. 칼끝이 아주 조금 흔들리고, 사막 위로 서늘한 침묵이 흐른다. 남자는 아시나에게 묘한 흥미를 느낀다.
              lines:
                - 아시나: 왜냐하면 저는…
                - 아시나: 대륙에서 하나뿐인,
                - 아시나: 미소녀니까요.
                  cg: cg_beauty
                  face: smug
                  fx: flash
                - 속마음: 미인계다!
                - 남자: …뭐?
                  face: dumbfounded
                - 아시나: 저는 말이죠.
                - 아시나: 미소녀는 나라에서 보호해야 할 의무가 있다고 생각해요.
                - 아시나: 예쁘고 아름다운 걸 지키는 건 당연한 일이니까…
                - 아시나: 안 그래요?
                - 나레이션: 싸아… 사막 한가운데에 서늘한 침묵이 내려앉았다.
              effects: { 집착: 1, 호감: 1, flags: { 미인계: true } }
            mixed:
              gist: 남자는 짧게 되묻고 비웃음을 흘린다. 미인계는 반쯤만 먹혔다. 흥미는 생겼지만 의심은 거두지 않는다.
              lines:
                - 아시나: 왜냐하면 저는…
                - 아시나: 대륙에서 하나뿐인,
                - 아시나: 미소녀니까요.
                  cg: cg_beauty
                  face: smug
                  fx: flash
                - 남자: …뭐?
                  face: dumbfounded
                - 나레이션: 칼끝이 아주 잠깐 흔들렸다. 그러나 남자의 눈빛은 여전히 나를 재고 있었다.
              effects: { 집착: 1, 의심: 1, flags: { 미인계: true } }
            miss:
              gist: 남자의 표정이 싸늘하게 굳는다. 말장난으로 들린 탓에 아시나를 더 수상하게 여긴다.
              state_guard: [칼을 거두]
              lines:
                - 아시나: 왜냐하면 저는…
                - 아시나: 대륙에서 하나뿐인,
                - 아시나: 미소녀니까요.
                  cg: cg_beauty
                  face: smug
                - 남자: ……
                - 나레이션: 싸늘한 침묵. 남자의 눈빛이 한층 더 차가워졌다.
                - 속마음: 망했다.
              effects: { 정신력: -1, 의심: 2, flags: { 미인계: true } }
        - id: plead
          label: 결백을 호소한다
          stat: 매력
          hint: 억울함을 호소하고 길 잃은 여행자일 뿐이라고 애원한다.
          examples:
            - 억울해요! 저는 그냥 길을 물었을 뿐이에요!
            - 제발 살려 주세요
          keywords: [억울, 살려, 제발, 부탁, 그냥 길, 잘못, 결백, 여행자, 길을 잃]
          outcomes:
            hit:
              gist: 남자는 아시나의 눈을 오래 들여다본다. 거짓은 아닌 듯하다고 여겨 칼끝을 살짝 물린다. 그래도 칼을 거두지는 않는다.
              lines:
                - 아시나: 억울해요! 전 정말 길을 물어본 것밖에 없다고요!
                - 나레이션: 남자는 한참 동안 내 눈을 들여다보았다. 목에 닿아 있던 칼끝이 손가락 한 마디만큼 물러났다.
              effects: { 의심: -1, 호감: 1 }
            mixed:
              gist: 남자는 애원을 듣고도 냉담하다. 의심은 그대로지만 아시나의 말을 끝까지 듣기는 한다.
              lines:
                - 아시나: 제발요, 전 그냥 길 잃은 여행자예요!
                - 남자: 왜지?
                - 속마음: 말이 안 통해…!
              effects: { 의심: 1 }
            miss:
              gist: 남자는 애원을 지루하다는 듯 흘려 넘긴다. 아시나의 목소리가 떨릴수록 그의 눈빛은 더 차가워진다.
              state_guard: [칼을 거두]
              lines:
                - 아시나: 사, 살려 주세요…
                - 나레이션: 남자는 지루하다는 듯 칼자루를 고쳐 쥐었다. 목소리가 떨릴수록 그의 눈빛은 차가워졌다.
              effects: { 정신력: -1, 의심: 2 }
        - id: bluff
          label: 말재주로 둘러댄다
          stat: 재치
          hint: 그럴듯한 거짓말이나 말재주로 자기가 쓸모 있다고 내세운다(상인, 길잡이, 보상 약속 등).
          examples:
            - 저를 살려 주시면 큰 보상을 드릴게요
            - 저는 크라차 상단 사람이에요. 저를 해치면 곤란해질걸요
          keywords: [살려 두면, 살려두면, 상인, 상단, 보상, 돈, 몸값, 쓸모, 길잡이, 거래, 약속, 곤란]
          outcomes:
            hit:
              gist: 남자는 아시나의 말솜씨에 흥미를 느낀 듯 입꼬리를 비튼다. 믿지는 않지만 당장 베기엔 아깝다고 여긴다.
              lines:
                - 아시나: 저를 살려 두면 분명 쓸모가 있을 거예요. 장담해요!
                - 남자: 하. 혀는 잘 돌아가는군.
                  face: sneer
                - 나레이션: 믿는 눈치는 아니었다. 다만 당장 벨 생각도 사라진 듯했다.
              effects: { 집착: 1, flags: { 거래: true } }
            mixed:
              gist: 남자가 거짓말의 빈틈을 날카롭게 짚는다. 아시나의 등에 식은땀이 흐른다. 그래도 정말 쓸모가 있는지 시험해 볼 생각이 든다.
              lines:
                - 아시나: 저는 크라차 상단 사람이에요. 저를 해치면 곤란해지실걸요?
                - 남자: 상단 사람이 짐도 낙타도 없이 사막을 헤맨다?
                  tie: true
                - 속마음: …아차.
                  tie: true
              effects: { 의심: 1, 집착: 1, flags: { 거래: true } }
            miss:
              gist: 거짓말이 들통난다. 남자는 칼끝을 더 바짝 들이댄다. 상처는 내지 않는다.
              state_guard: [칼을 거두]
              lines:
                - 아시나: 저, 저를 해치면 큰일 날 거예요! 제 뒤에는… 아무튼 엄청난 사람들이 있다고요!
                - 남자: …뭐?
                  face: wary
                - 나레이션: 칼끝이 목에 한층 바짝 다가왔다.
              effects: { 정신력: -1, 의심: 2 }
        - id: noble
          label: 신분과 교양을 내세운다
          stat: 교양
          hint: 몸에 밴 예법이나 귀한 신분을 내세워 함부로 대할 사람이 아님을 보인다.
          examples:
            - 저는 귀한 집안 사람이에요. 함부로 대하면 후회하실 거예요
            - 칼끝 앞에서도 허리를 펴고 정중하게 예를 갖춘다
          keywords: [귀족, 가문, 신분, 예법, 예를, 인사, 공녀, 집안, 크롬웰, 웰든, 정중, 정체를]
          outcomes:
            hit:
              gist: 아시나의 말과 태도에 밴 교양에 남자의 눈빛이 달라진다. 평범한 떠돌이가 아니라는 것을 알아채고 쉽게 죽일 수 없는 상대로 본다. 신분 주장 자체는 믿지 않는다.
              lines:
                - 나레이션: 나는 칼끝 앞에서도 허리를 곧게 펴고, 몸에 밴 예법대로 고개를 숙였다.
                  tie: true
                - 남자: …떠돌이의 몸가짐은 아니군.
                  tie: true
                  face: surprised
                - 속마음: 통했다…! 이제 함부로는 못 하겠지.
              effects: { 집착: 1, 의심: 1, flags: { 신분: true } }
            mixed:
              gist: 남자는 사막 한복판에서 신분을 내세우는 것을 비웃는다. 그러나 아시나의 말씨를 곱씹으며 기억해 둔다.
              lines:
                - 아시나: 저는 귀한 집안 사람이에요. 함부로 대하면 후회하실 거예요.
                - 남자: 사막 한복판에서 집안 타령이라.
                  tie: true
                - 나레이션: 비웃음 섞인 목소리였지만, 그는 내 말투를 곱씹는 듯했다.
              effects: { 의심: 2, flags: { 신분: true } }
            miss:
              gist: 남자는 북쪽 말씨를 듣고 냉소한다. 의심이 확신으로 기운다.
              state_guard: [칼을 거두]
              lines:
                - 아시나: 감히 누구에게 칼을 겨누는 거예요? 저는…
                - 남자: 하. 웃기는 여자군.
                - 속마음: 말하면 안 될 걸 말해 버렸어…!
              effects: { 정신력: -1, 의심: 3 }
        - id: resist
          risky: true
          label: 칼을 밀어내고 몸을 뺀다
          stat: 근력
          hint: 칼날을 밀쳐 내거나 몸을 날려 칼끝에서 벗어나려 한다.
          examples:
            - 칼날을 밀어내고 뒤로 물러선다
            - 모래를 차서 눈을 가리고 도망친다
          keywords: [도망, 달아나, 밀어, 밀치, 차서, 뛰어, 피한다, 모래를, 물러, 몸을 날]
          outcomes:
            hit:
              gist: 아시나가 칼끝에서 몸을 빼는 데 성공한다. 남자는 쫓지 않고 오히려 재미있다는 듯 그녀를 내려다본다.
              lines:
                - 나레이션: 나는 칼날을 가방으로 밀쳐 내고 뒤로 몸을 날렸다.
                  tie: true
                - 남자: 하.
                - 나레이션: 남자는 쫓아오지 않았다. 오히려 재미있다는 듯 나를 내려다볼 뿐이었다.
              effects: { 집착: 1, 탈주: 1, flags: { 도주: true } }
            mixed:
              gist: 칼끝에서 몸을 빼 달아나지만 모래에 몇 번이나 넘어지며 힘을 쏟는다. 남자의 시선이 등 뒤에 박힌다.
              lines:
                - 나레이션: 몸을 빼는 데는 성공했지만, 모래에 발이 걸려 몇 번이나 넘어졌다.
                - 나레이션: 등 뒤에 붉은 눈이 박혀 있는 것 같았다.
              effects: { 의심: 1, 귀찌: -1, flags: { 도주: true } }
            miss:
              gist: 움직이기도 전에 호위가 아시나의 팔을 붙든다. 남자의 칼끝이 그녀의 턱을 천천히 들어 올린다.
              state_guard: [도망쳤다, 빠져나왔다]
              lines:
                - 나레이션: 움직이기도 전에 호위 하나가 내 팔을 붙들었다.
                - 나레이션: 남자의 칼끝이 내 턱을 천천히 들어 올렸다.
              effects: { 의심: 2 }
        - id: bag
          label: 마법 가방에서 물건을 꺼낸다
          stat: 손재주
          item: magic_bag
          hint: 마법 가방에서 무언가를 꺼내 보여 주거나 상황을 바꾸려 한다.
          examples:
            - 가방에서 지도를 꺼내 보여 준다
            - 낡은 지도를 펼쳐 보이며 길을 잃었다고 말한다
            - 가방 속 물건으로 시선을 끈다
          keywords: [가방, 지도, 꺼내, 꺼낸, 펼쳐, 보여]
          outcomes:
            hit:
              gist: 가방에서 꺼낸 물건이 길 잃은 여행자라는 말에 힘을 실어 준다. 남자의 경계가 조금 풀린다.
              lines:
                - 나레이션: 나는 천천히 가방에서 낡은 지도를 꺼내 펼쳐 보였다.
                  tie: true
                - 아시나: 보세요, 전 정말 길을 잃었을 뿐이라고요.
                - 나레이션: 남자의 시선이 지도와 내 얼굴을 오갔다. 경계가 아주 조금 풀렸다.
              effects: { 의심: -1, flags: { 지도_꺼냄: true } }
            mixed:
              price: [hood_slip, man_doubt]
              gist: 남자는 가방이 보기보다 많이 들어간다는 걸 눈치챈다. 마법 물건을 지닌 떠돌이라는 점이 오히려 수상하다.
              lines:
                - 나레이션: 가방에서 지도를 꺼내는데, 손이 들어간 깊이가 가방 크기와 맞지 않았다.
                  tie: true
                - 남자: 마법 가방이라. 떠돌이치고는 귀한 걸 지녔군.
                  if: "!flag:신분_노출"
                - 남자: …뭐?
                  if: "flag:신분_노출"
              effects: { 의심: 1, 집착: 1, flags: { 지도_꺼냄: true } }
            miss:
              price: [bag_taken, guard_step]
              gist: 가방에 손을 넣는 순간 호위가 손목을 낚아챈다. 무기를 꺼내려 한 것으로 오해받는다.
              lines:
                - 나레이션: 가방에 손을 넣는 순간 호위가 내 손목을 낚아챘다.
                - 남자: 무기라도 꺼낼 셈이었나?
              effects: { 의심: 2 }
    next:
