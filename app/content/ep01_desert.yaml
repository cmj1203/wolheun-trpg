          keywords: [예쁜, 미소녀, 길동무, 웃, 심심]
          outcomes:
            hit:
              gist: 당돌한 말에 남자가 짧게 웃는다.
              lines:
                - 아시나: 사막 길은 심심하잖아요. 저처럼 재미있는 길동무가 또 어디 있어요?
                - 남자: 하. 입이 값을 하는군.
              effects: { 집착: 1, 호감: 1 }
            mixed:
              gist: 남자는 웃지 않는다.
              lines:
                - 아시나: 재미있는 길동무, 어때요?
                - 나레이션: 남자는 웃지 않았다.
              effects: { 집착: 1 }
            miss:
              gist: 남자가 차갑게 내려다본다. 말이 허공에 뜬다.
              lines:
                - 아시나: 저, 저 재미있는 사람이에요…
                - 나레이션: 내 말은 사막 바람에 그대로 흩어졌다.
              effects: { 정신력: -1, 의심: 1 }
    next: r4_walk

  r4_walk:
    title: 크라차까지
    bg: desert_wide
    cast: { left: 아시나, right: 남자 }
    lines:
      - 남자: 값은 크라차에서 매기지.
      - 남자: 크라차까지다. 쓸모가 없어지면 그때 벤다.
      - 아시나: 네, 네! 걱정 마요. 제가 얼마나 쓸모 있는 사람인데요!
        face: smile
        if: "flag:쓸모_내세움"
      - 아시나: …네? 저를 데려가겠다고요?
        face: surprised
        if: "!flag:쓸모_내세움"
      - 나레이션: 밧줄은 없었다. 복면을 쓴 호위 하나가 내 곁에 말없이 붙었을 뿐이다.
      - 속마음: …잠깐. 해가 왼쪽에 있는데, 왜 우리는 북쪽으로 걷는 거야?
        face: wary
    next: e_deal

  r5_claim:
    title: 귀하신 몸
    bg: desert_near
    cast: { left: 아시나, right: 남자 }
    lines:
      - 나레이션: 사막에 어울리지 않는 향 냄새가 났다. 남자의 반지, 호위의 자세, 모래 위의 그림자.
      - 남자: 귀한 몸이 호위도 없이 사막을 헤맸다?
        face: sneer
      - 나레이션: 칼끝은 한 치도 물러나지 않았다.
      - 남자: 말씨는 북쪽이군. 증명해 봐라, 여자.
        face: wary
    free:
      nudge:
        - 나레이션: 남자가 지루하다는 듯 고개를 기울였다.
      prompt: 귀한 신분이라는 말을 지금 증명해야 한다.
      prices:
        - { id: blade_press, tag: 자리, harm: 마음, weight: soft, text: 칼끝이 턱 밑을 눌렀다., effects: { 정신력: -1, flags: { 칼_밀착: true } } }
        - { id: guard_laugh, tag: 상대행동, harm: 마음, weight: soft, text: 호위 둘이 눈을 마주치며 웃음을 참았다., effects: { 정신력: -1, 의심: 1 } }
        - { id: sun_set, tag: 시간, weight: soft, text: 해가 지평선에 걸렸다., effects: { 귀찌: -1 } }
        - { id: name_slip, tag: 수치, weight: soft, spoken: true, text: 집안 이름을 말하려다 입을 다물었다., effects: { 의심: 1 } }
        - { id: ring_demand, tag: 소지품, weight: hard, text: 남자가 증표로 귀찌를 내놓으라며 손을 내밀었다., effects: { 의심: 2, flags: { 귀찌_요구: true } } }
        - { id: guard_seize, tag: 상대행동, harm: 몸, weight: hard, text: 호위가 어깨를 눌러 무릎을 꿇렸다., effects: { 체력: -1, 의심: 1, flags: { 무릎_꿇림: true } } }
      aim: 귀한 신분이라는 말을 말과 몸가짐으로 믿게 만든다.
      situation: 아시나가 귀한 신분이라고 내세우자 남자가 증명해 보라고 한다. 칼끝은 아직 아시나를 겨눈다.
      goal: 아시나가 말과 몸가짐으로 신분을 뒷받침한다. 남자는 믿지 않지만 값을 따져 보기 시작한다.
      speakers: [나레이션, 속마음, 아시나, 남자]
      must_not:
        - 남자가 자기 이름이나 신분을 밝힌다
        - 남자가 아시나의 진짜 정체를 확신한다
        - 아시나가 크게 다치거나 죽는다
        - 호위가 말을 한다
        - 귀찌 변장이 풀리거나 은발이 드러난다
        - 아시나가 귀찌를 빼거나 본모습을 보여 준다
        - 남자가 아시나의 말을 완전히 믿는다
        - 남자가 칼을 완전히 거두고 친절해진다
      state_guard: [모래바닥에 묶]
      echo_only: [웰든, 리세아, 몸값, 미소녀]
      idle:
        threat: false
        lines:
          - 나레이션: 호위 하나가 말없이 칼자루에 손을 얹었다.
          - 남자: 지루하군.
        effects: { 의심: 1 }
      default_approach: manners
      approaches:
        - id: manners
          label: 몸에 밴 예법을 보인다
          before: { flags: { 신분_고집: true } }
          stat: 교양
          hint: 칼끝 앞에서 궁정 예법을 그대로 보여 준다.
          examples: [허리를 펴고 궁정식으로 인사한다]
          keywords: [예법, 인사, 궁정, 허리, 정중, 우아]
          outcomes:
            hit:
              gist: 흠잡을 데 없는 예법에 남자의 눈빛이 달라진다.
              lines:
                - 나레이션: 나는 모래투성이 옷자락을 쥐고, 궁정에서 배운 그대로 고개를 숙였다.
                - 남자: …흉내는 아니군.
                - 속마음: 예법 선생님, 감사합니다…!
              effects: { 집착: 1 }
            mixed:
              gist: 예법은 제대로였지만 후들거리는 다리가 웃음거리가 된다.
              lines:
                - 나레이션: 예법은 완벽했다. 후들거리는 다리만 빼면.
                - 남자: 다리는 평민이군.
              effects: { 의심: 1 }
            miss:
              gist: 모래에 발이 빠져 인사하다 비틀거린다.
              lines:
                - 나레이션: 고개를 숙이다 모래에 발이 빠져 앞으로 고꾸라질 뻔했다.
                - 남자: 그것도 예법인가?
              effects: { 의심: 2 }
        - id: knowledge
          label: 북대륙 사정을 늘어놓는다
          before: { flags: { 신분_고집: true } }
          stat: 재치
          hint: 귀족만 알 법한 북대륙 사정을 말한다.
          examples: [북대륙 궁정 이야기를 늘어놓는다]
          keywords: [북대륙, 크롬웰, 궁정, 제국, 연회, 사정]
          outcomes:
            hit:
              gist: 귀족만 알 법한 이야기에 남자가 말없이 듣는다.
              lines:
                - 아시나: 크롬웰 제국의 연회가 어떻게 돌아가는지 말해 드릴까요? 줄 서는 순서부터 까다롭거든요.
                - 나레이션: 남자는 말없이 끝까지 들었다.
              effects: { 집착: 1, 탈주: 1 }
            mixed:
              gist: 말은 통했지만 위험해진다.
              lines:
                - 아시나: 제국 사정이라면 제가 잘 알아요!
                - 남자: …뭐?
                  tie: true
                - 속마음: …아차.
                  tie: true
              effects: { 의심: 1, 집착: 1 }
            miss:
              gist: 이야기가 앞뒤가 맞지 않아 남자가 코웃음 친다.
              lines:
                - 아시나: 그, 그러니까 제국에서는… 음…
                - 남자: 책으로 배웠나?
              effects: { 정신력: -1, 의심: 2 }
        - id: bluster
          label: 당당하게 호통친다
          before: { flags: { 신분_고집: true } }
          stat: 매력
          mods:
            - { if: "flag:칼_밀착", value: -1, label: 칼이 닿아 있음 }
          hint: 귀족답게 고개를 들고 호통친다.
          examples: [감히 누구에게 칼을 겨누냐고 호통친다]
          keywords: [감히, 호통, 당당, 고개를 들, 무례]
          outcomes:
            hit:
              gist: 당당한 호통에 남자가 오히려 재미있어한다.
              lines:
                - 아시나: 무례하군요. 제 몸값이 그 칼보다 비쌀 텐데요.
                - 남자: 하. 값을 부르는 포로는 처음이군.
                  tie: true
              effects: { 집착: 2 }
            mixed:
              gist: 기세는 좋았지만 목소리 끝이 떨린다.
              lines:
                - 아시나: 무, 무례해요!
                - 나레이션: 호통치려던 목소리 끝이 조금 떨렸다.
              effects: { 집착: 1, 의심: 1 }
            miss:
              gist: 호통에 호위가 칼자루를 쥔다. 남자가 손을 들어 멈추지만 눈빛은 차갑다.
              lines:
                - 아시나: 감히 누구한테…!
                - 나레이션: 호위들이 일제히 칼자루를 쥐었다. 남자가 손을 들어 그들을 멈췄다.
              effects: { 정신력: -1, 의심: 2 }
    next: r5_price

  r5_price:
    title: 값을 매기다
    bg: desert_near
    cast: { left: 아시나, right: 남자 }
    lines:
      - 남자: 진짜라면 쓸모가 있다. 가짜라면 그때 베면 된다.
        face: neutral
      - 나레이션: 남자가 손짓하자 호위들이 한 걸음 물러났다. 포로가 아니라 귀한 물건을 대하는 거리였다.
        if: "flag:신분_고집"
      - 속마음: 살았… 나? 아니, 내 입으로 내 값을 매겨 버린 거 아니야?
        face: wary
        if: "flag:신분_고집"
      - 남자: 귀하다는 말이 진짜인지는 크라차에서 가려 보지.
        face: wary
        if: "!flag:신분_고집"
      - 나레이션: 호위들이 말없이 내 양옆에 섰다.
        if: "!flag:신분_고집"
      - 속마음: 살았… 나? 대체 나를 어디로 데려가는 거야?
        face: wary
        if: "!flag:신분_고집"
    next: e_value

  e_quit:
    title: 여기까지
    lines:
      - 나레이션: 이야기는 여기서 멈췄다. 아시나의 사막은 언제든 다시 이어 갈 수 있다.
    ending:
      id: quit
      title: 여기까지
      summary: 플레이어가 여기서 멈추기로 했다.
      next_hook: 새로 시작하면 다시 지르다에서 이어진다.

  e_road:
    title: 크라차로 가는 길
    bg: desert_night
    cast: { center: 아시나 }
    lines:
      - 나레이션: 물주머니를 끌어안고 걷기를 한참, 지평선 끝에 작은 불빛들이 떠올랐다.
      - 속마음: 저건… 마을이야. 진짜로 건넜어!
        face: smile
      - 나레이션: 그런데도 나는 몇 번이나 뒤를 돌아보았다. 등 뒤의 시선이 도무지 사라지지 않았다.
    ending:
      id: road
      title: 크라차로 가는 길
      summary: 아시나는 혼자 힘으로 사막을 건넜다. 그 남자는 잡지 않았고, 물주머니 하나를 남겼다.
      next_hook: 다음 장면은 크라차 쪽 마을이다. 붙잡히지 않은 대신, 그 남자가 언제 다시 나타날지 모른다.

  e_deal:
    title: 길잡이 계약
    bg: desert_wide
    cast: { left: 아시나, right: 남자 }
    lines:
      - 나레이션: 따져 물을 틈은 없었다. 앞서 걷는 터번 끝의 붉은 보석만이 해를 받아 번쩍였다.
      - 속마음: 일단 따라가자. 어디로 가는지는… 걸으면서 알아내면 되지.
        face: wary
    ending:
      id: deal
      title: 길잡이 계약
      summary: 아시나는 쓸모를 팔아 목숨을 샀다. 포로도 손님도 아닌 채로 남자 일행과 함께 걷는다.
      next_hook: 다음 장면에서는 일행 안에서 움직인다. 쓸모를 계속 증명하면서, 일행이 어디로 가는지 알아내야 한다.

  e_value:
    title: 값을 매긴 여자
    bg: blackout
    lines:
      - 남자: 데려가라. 귀한 몸이라니, 귀하게 모셔야지.
        face: sneer
        if: "flag:신분_고집"
      - 남자: 데려가라. 값은 크라차에서 매기지.
        if: "!flag:신분_고집"
      - 나레이션: 묶이지는 않았다. 그게 오히려 더 무서웠다.
    ending:
      id: value
      title: 값을 매긴 여자
      summary: 아시나는 자기 입으로 귀한 신분을 내세웠다. 손님 대접을 받는 인질이 되어 끌려간다.
      next_hook: 다음 장면에서는 대접은 좋아도 눈이 많다. 스스로 내세운 신분이 진짜인지 시험받는다.

  e_spy:
    title: 수상한 이방인
    bg: blackout
    lines:
      - 남자: 묶어라. 수상한 짓을 하면 그 자리에서 베어도 좋다.
        face: wary
        if: "!flag:포박"
      - 나레이션: 거친 밧줄이 손목을 파고들었다. 나는 정신을 잃었다.
        if: "!item:magic_bag"
      - 나레이션: 거친 밧줄이 손목을 파고들었다. 마법 가방까지 빼앗기는 걸 보면서, 나는 정신을 잃었다.
        if: "item:magic_bag"
        effects: { lose: [magic_bag] }
    ending:
      id: spy
      title: 수상한 이방인
      summary: 목숨은 건졌지만 그 남자는 아시나를 굳게 경계한다. 마법 가방을 빼앗긴 채 끌려간다.
      next_hook: 다음 장면에서는 감시가 삼엄해진다. 가방 없이, 몸에 지닌 것만으로 빠져나갈 길을 찾아야 한다.

  e_curious:
    title: 흥미로운 여자
    bg: blackout
    lines:
      - 남자: 데려가라. 깨어나면 그 입이 얼마나 더 떠드는지 들어 보지.
        face: sneer
      - 나레이션: 붉은 눈은 끝까지 나를 놓아주지 않았다. 그게 사막에서의 마지막 기억이었다.
    ending:
      id: curious
      title: 흥미로운 여자
      summary: 그 남자는 아시나에게 흥미를 느꼈다. 끌려가는 신세지만, 그가 다시 찾아올지도 모른다.
      next_hook: 다음 장면에서는 아무도 아시나를 함부로 대하지 못한다. 대신 그 남자의 눈길이 탈주를 더 어렵게 만든다.

  e_survivor:
    title: 살아남은 자
    bg: blackout
    lines:
      - 남자: 끌고 가라.
      - 나레이션: 살아남는 자와 죽는 자. 적어도 오늘, 나는 살아남는 쪽이었다.
      - 나레이션: 긴장이 풀리자 눈앞이 하얘졌다. 일주일 만에 처음으로, 나는 정신을 놓았다.
    ending:
      id: survivor
      title: 살아남은 자
      summary: 아시나는 살아남았다. 다음에 눈을 뜨는 곳은 낯선 나라 어딘가일 것이다.
      next_hook: 다음 장면의 탈주 난이도는 지금의 탈주 준비도와 귀찌 수명으로 정해진다.

  # ---- 작은 끝(상태 한계). bg 암전, 나레이션 2~3줄 + 여우 한 줄. 15세 ----
  x_unmasked:
    title: 은발
    bg: blackout
    lines:
      - 나레이션: 귓불에서 마지막 온기가 빠져나갔다. 바람에 흩날린 머리칼이 햇빛을 받아 은빛으로 번쩍였다.
        if: "!flag:밤"
      - 나레이션: 귓불에서 마지막 온기가 빠져나갔다.
        if: "flag:밤"
      - 나레이션: 붉은 눈이 그 은빛을 놓치지 않았다. 뒷말은 듣지 못했다.
        if: "flag:상대_곁"
