  r4_prove:
    title: 그럼 증명해라
    bg: desert_near
    cast: { left: 아시나, right: 남자 }
    lines:
      - 나레이션: 낙타 가죽 냄새가 훅 끼쳤다. 남자의 곡도, 호위의 눈길, 가방 속 지도.
      - 남자: 쓸모가 있다고 했나.
