id: ep01_desert
title: 죽음의 사막 지르다
episode: 1화 · 사막 조우
source: 웹툰 「월흔」 1화 PSD 005~014 (그림 하나비 / 각색 미예 / 원작 윤슬 / 채색 및 보정 루라키 / 도움 팀 나비, 파아란)
rating: 15세 이용가
start: b00_open

sheet:
  name: 아시나
  abilities: { 재치: 1, 손재주: 1, 매력: 2, 근력: 0, 교양: 1 }
  tracks: { 체력: 4, 정신력: 4, 의심: 0, 집착: 0, 호감: 0, 귀찌: 7, 탈주: 0, 행운: 6 }
  collapse_to: e_spy
  # 긴장값(1~6). 장면 검사(twist 가 있는 비트)에서 d6 이 이 값 이하면 장면이 달라진다. 판정 성공 -1, 실패 +1.
  tension: 3
  reveal:
    - { note: man, tracks: [의심, 집착, 호감] }
    - { note: captive, tracks: [탈주] }
    - { flag: 귀찌_설명, tracks: [귀찌] }
  items:
    - id: magic_bag
      file: assets/ep01/gen/items/item_magic_bag.png
      name: 마법 가방
      desc: 보기보다 훨씬 많이 들어가는 마법 가방. 여행 짐과 낡은 지도가 들어 있다.
      states:
        - { flag: 가방_끈, label: 끈 끊김, desc: 끈이 끊어져 손으로 쥐고 다닌다. }
        - { flag: 짐_쏟음, label: 짐 쏟아짐, desc: 호위가 뒤집어 짐이 모래에 쏟아졌다. }
    - id: earring
      file: assets/ep01/gen/items/item_earring.png
      name: 마법 귀찌
      desc: 귓불에 달린 마법 귀찌.
    - id: map
      file: assets/ep01/gen/items/item_map.png
      name: 낡은 지도
      desc: 사막 한가운데서는 별 도움이 되지 않는 지도.
      container: { item: magic_bag, unless: "flag:지도_꺼냄 || flag:짐_쏟음" }
      states:
        - { flag: 지도_찢김, label: 찢김, desc: 한 귀퉁이가 찢겨 나갔다. }
    - id: pin
      file: assets/ep01/gen/items/item_pin.png
      name: 가는 핀
      desc: 옷 안쪽에 숨겨 둔 가늘고 단단한 핀.
      hidden: true

