              lines:
                - 아시나: 저, 저는 뭐든 할 수 있어요! 뭐든요!
                - 남자: 뭐든 할 줄 아는 자는 아무것도 못 하지.
                  tie: true
              effects: { 의심: 1 }
        - id: charm
          label: 당돌하게 웃어 보인다
          before: { flags: { 쓸모_내세움: true } }
