              lines:
                - 나레이션: 물통을 기울이자 마지막 몇 방울이 혀끝에 닿았다.
                - 속마음: 이제 진짜 없어…
              effects: { 체력: 1, 귀찌: -1 }
            miss:
              gist: 물통 뚜껑을 놓쳐 남은 물을 흘린다.
              lines:
                - 나레이션: 얼어붙은 손끝에서 물통이 미끄러졌다. 모래는 남은 물을 순식간에 삼켰다.
              effects: { 귀찌: -2 }
        - id: shelter
          label: 바람을 피할 곳을 찾는다
          stat: 재치
          mods:
            - { if: "flag:바위_온기", value: 1, label: 온기 남은 바위 }
            - { if: "flag:짐승_소리", value: -1, label: 가까워지는 짐승 소리 }
          hint: 바위 그늘이나 모래 구덩이로 추위를 피한다.
          examples: [바위 뒤에 몸을 웅크린다, 모래를 파고 들어간다]
          keywords: [바위, 웅크, 구덩이, 파고, 불, 쉰다, 잔다]
          outcomes:
            hit:
              gist: 바위 틈을 찾아 바람을 피하고 숨을 고른다.
              lines:
                - 나레이션: 바위 틈으로 기어들자 칼 같던 바람이 뚝 끊겼다.
              effects: { 체력: 1, 정신력: 1, 탈주: 1 }
            mixed:
              gist: 바람은 피했지만 눈을 붙이는 사이 시간을 잃는다.
              price: [water_spill]
              lines:
                - 나레이션: 잠깐 눈을 감았을 뿐인데, 달이 한참이나 옮겨 가 있었다.
                  sets: 밤
              effects: { 체력: 1, 정신력: 1, 귀찌: -1 }
            miss:
              gist: 바위 뒤에 숨었지만 바람이 방향을 바꾸어 모래를 뒤집어쓴다.
              lines:
                - 나레이션: 바람이 방향을 바꾸더니 모래를 한가득 퍼부었다.
              effects: { 체력: -1, 귀찌: -2 }
    next: r3_night

  r3_night:
    title: 웃기는 여자
    bg: desert_night
    cast: { left: 아시나, right: 남자 }
    effects: { flags: { 밤: true } }
    lines:
      - 나레이션: 모래 언덕 위에 그림자 하나가 서 있었다.
      - 남자: 하. 웃기는 여자군.
