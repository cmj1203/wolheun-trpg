          hint: 북대륙 소식이나 흥정 솜씨처럼 말로 쓸모를 내세운다.
          examples: [북대륙 소식이라면 뭐든 알려 줄 수 있어요]
          keywords: [북대륙, 소식, 흥정, 말솜씨, 통역, 정보, 알려]
          outcomes:
            hit:
              gist: 아시나의 말솜씨에 남자가 입꼬리를 비튼다.
              lines:
                - 아시나: 북대륙 소식, 시세, 소문. 필요한 건 뭐든 말해 드릴 수 있어요.
                - 남자: 혀는 정말 잘 돌아가는군.
              effects: { 집착: 1 }
            mixed:
              gist: 말은 그럴듯했지만 북대륙을 너무 잘 안다는 게 수상하다.
              lines:
                - 아시나: 북대륙 소식이라면 제가 훤하죠!
                - 남자: 훤하다라. 그것도 기억해 두지.
                  tie: true
