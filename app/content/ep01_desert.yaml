                - 남자: 대략이라.
                  tie: true
              effects: { 의심: 1 }
            miss:
              gist: 방향을 잘못 짚어 호위가 고개를 젓는다. 남자는 그래도 재미있어한다.
              lines:
                - 아시나: 크라차는 저쪽이에요!
                - 나레이션: 복면 쓴 호위가 말없이 정반대 쪽을 보았다.
                - 남자: 하.
              effects: { 의심: 1, 집착: 1 }
        - id: wits
