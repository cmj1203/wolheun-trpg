    },
    {
      "if": "flag:ep06_아시나_나시르소개",
      "text": "라가 청발 남자를 자신의 서기관 나시르라고 소개했다.",
      "state_guard": []
    },
    {
      "if": "flag:ep06_아시나_가림천",
      "text": "아시나는 외간 남자 앞에서 얼굴을 가리라는 말을 따라 분홍색 얼굴 가림천을 썼다. 지시자는 미확정이며 이후에도 가림천을 유지한다.",
      "state_guard": []
    },
    {
      "if": "flag:ep06_아시나_시그렌위치",
      "text": "시그렌은 크롬웰 남동쪽 국경에 맞닿은 작은 왕국이라고 아시나가 설명했다. 지도 삽입은 실제 소지품 획득이 아니다.",
      "state_guard": []
    },
