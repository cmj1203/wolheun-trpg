    },
    {
      "if": "flag:ep04_active && flag:ep04_earring_week_known",
      "text": "현재 남은 시간은 아시나 계산으로 일주일이다. 남은 수치를 7로 초기화하지 않는다.",
      "state_guard": [
        "귀찌 수명이 다시 일주일로 찼다"
      ]
    },
    {
      "if": "flag:ep04_active && !flag:ep04_name_known",
      "text": "남성의 실명은 아직 직접 듣지 못했다. 시하드라는 앞선 호칭은 실명·통치자 확인과 별개다.",
      "state_guard": [
        "베히다트라는 이름을 들었다"
      ]
    },
    {
      "if": "flag:ep04_active && flag:ep04_name_known",
      "text": "남성은 시하드 젠 베히다트라고 자기소개했다. 다른 이름표의 남성과 같은 사람이다.",
      "state_guard": []
    },
    {
      "if": "flag:ep04_active && !flag:ep04_ruler_known",
      "text": "통치자임은 아직 확인하지 않았다. c035 권력 주장과 c037 조건문은 확인을 대신하지 못한다.",
      "state_guard": [
        "왕이라는 사실을 확인했다"
      ]
    },
    {
      "if": "flag:ep04_active && flag:ep04_ruler_known",
      "text": "베히다트는 페시안의 주인이라고 밝혔다.",
      "state_guard": []
    },
    {
      "if": "flag:ep04_active && flag:ep04_title_known",
      "text": "아시나는 라 쿤·살아있는 신이라는 칭호를 연결했다. 초능력 입증이 아니다.",
      "state_guard": [
        "신의 힘을 확인했다"
      ]
    },
    {
      "if": "flag:ep04_active && flag:ep04_origin_private",
      "text": "크롬웰 출신 독백은 베히다트가 듣지 못했다. 이전 귀족 자제 추측은 공녀 정체 확인이 아니다.",
      "state_guard": [
        "공녀라는 사실을 알아챘다",
        "속마음을 들었다"
      ]
    },
    {
      "if": "flag:ep04_active && flag:ep04_distance_kept",
