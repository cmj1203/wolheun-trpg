  "facts": [
    {
      "if": "flag:ep03_시작 && !flag:ep03_하렘_앎",
      "text": "아시나는 시녀를 따라가지만 목적지를 아직 듣지 못했다. 방의 용도와 아이라라는 말은 아직 모른다.",
      "state_guard": [
        "하렘",
        "아이라"
      ]
    },
    {
      "if": "flag:ep03_하렘_앎 && !flag:ep03_유일한아이라_앎",
      "text": "아시나는 하렘에 들어왔다는 말만 들었다. 입실자의 수와 아이라라는 설명은 아직 듣지 못했다.",
      "state_guard": [
        "유일한 아이라",
        "유일한 후궁"
      ]
    },
    {
      "if": "flag:ep03_짐_수중없음",
      "text": "여행복과 가방은 목욕 때 손을 떠났다. 짐과 치부책은 돌아오지 않았다. 삽입 그림은 아시나의 걱정과 기억이며 보관 장소·처리자는 모른다.",
      "state_guard": [
        "짐을 되찾",
        "가방을 되찾",
        "치부책을 되찾",
        "보관소에",
        "압수한 시녀"
      ]
    },
    {
      "if": "flag:ep03_귀찌_변장설명",
      "text": "귀찌는 착용 중이며 갈색 머리·갈색 눈의 변장을 유지한다. 은발 삽입은 설명이고 실제 변장 해제가 아니다. 시녀에게 기능을 말하지 않았다.",
      "state_guard": [
        "변장이 풀려",
        "은발이 드러",
        "붉은 눈이 드러"
      ]
    },
    {
      "if": "flag:ep03_시작",
      "text": "아시나는 붉은 휘장 방과 뒤의 접견실에 없었다. 관객이 본 궁정 대화는 아시나의 경험·인물 기억·직접 얻은 정보가 아니다.",
      "state_guard": [
        "잘릴에게 들",
        "잘릴을 만났",
        "접견실에서 들",
        "총기가 흐려졌다는 소문을 들"
      ]
    },
    {
      "if": "flag:ep03_복장_청록복",
      "text": "아시나는 금색 머리장식·귀찌·보석과 청록 궁정복을 착용한다. 여행복과 사막 후드를 입고 있지 않다.",
      "state_guard": [
        "후드를 뒤집어",
        "여행복 소매",
        "베일을 걷"
      ]
    }
  ],
