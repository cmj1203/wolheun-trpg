  "facts": [
    {
      "if": "flag:ep08_r01 || !flag:ep08_r01",
      "text": "8화 독립 내부 검증용이다. 소지품과 수치는 캠페인 진입 상태를 증명하지 않는다. 궁정 알현과 순례 서술은 아시나가 보거나 들은 일이 아니다. 베히다트와 쿤·시하드는 같은 인물이며 속마음도 다른 인물에게 전달되지 않는다.",
      "state_guard": [
        "아시나가 게디크와 알현",
        "아시나가 자키야를 안다",
        "아시나가 연회 허가를 들었다"
      ]
    },
    {
      "if": "!flag:ep08_r10",
      "text": "아시나는 누르에게 조심할 인물에 관한 답을 아직 듣지 못했다.",
      "state_guard": [
        "대재상을 조심하라고 들었다"
      ]
    },
    {
      "if": "flag:ep08_r10",
      "text": "아시나는 누르가 대재상을 권력자로 꼽은 것만 들었다. 이름 게디크, 딸 자키야, 혼인 제안과 거절, 순례의 표기 차이는 별도 시점의 정보다.",
      "state_guard": [
        "누르가 게디크의 이름을 말했다",
        "누르가 자키야를 소개했다"
      ]
    }
  ],
